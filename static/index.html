<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>harvester-view</title>
<style>
:root{
  --bg:#f6f7f9;--panel:#fff;--ink:#1c2330;--ink2:#5b6472;--line:#dde2ea;
  --accent:#2563eb;--mark:#ffe58f;--warn-bg:#fff7d6;--warn-ink:#8a6d00;
  --err-bg:#fde8e8;--err-ink:#a12622;--ok-bg:#e6f4ea;--ok-ink:#1a7a3d;
}
@media (prefers-color-scheme: dark){
  :root{--bg:#14171c;--panel:#1d2129;--ink:#e6e9ef;--ink2:#9aa3b2;
        --line:#313845;--accent:#5b8def;--mark:#8a6d00;--warn-bg:#3a3212;
        --warn-ink:#ffd666;--err-bg:#3c1a1a;--err-ink:#ff9b9b;
        --ok-bg:#173325;--ok-ink:#7ed6a2;}
}
*{box-sizing:border-box}
body{margin:0;font:14px/1.55 "Segoe UI",system-ui,-apple-system,
  "Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink)}
header{display:flex;align-items:center;gap:12px;padding:10px 16px;
  background:var(--panel);border-bottom:1px solid var(--line);
  position:sticky;top:0;z-index:5;flex-wrap:wrap}
header h1{font-size:16px;margin:0;font-weight:600}
header .meta{color:var(--ink2);font-size:12px;margin-left:auto}
#tabs{display:flex;gap:2px}
#tabs button{border:none;background:none;border-radius:6px;padding:6px 12px;
  color:var(--ink2);cursor:pointer;font-size:13px}
#tabs button:hover{color:var(--ink)}
#tabs button.on{background:var(--bg);color:var(--accent);font-weight:600}
select,input,button{font:inherit;color:inherit;background:var(--panel);
  border:1px solid var(--line);border-radius:6px;padding:5px 8px}
button{cursor:pointer}button:hover{border-color:var(--accent)}
button:disabled{opacity:.45;cursor:not-allowed}
#banner{display:none;margin:10px 16px 0;padding:9px 12px;border-radius:8px;
  font-size:13px}
#banner.warn{display:block;background:var(--warn-bg);color:var(--warn-ink)}
#banner.err{display:block;background:var(--err-bg);color:var(--err-ink)}
main{display:flex;gap:14px;padding:14px 16px;align-items:flex-start}
section.tab{padding:14px 16px}
#left{flex:1.25;min-width:0}
#detail{flex:1;min-width:0;background:var(--panel);border:1px solid
  var(--line);border-radius:10px;padding:12px 14px;display:none;
  position:sticky;top:64px;max-height:calc(100vh - 80px);
  overflow:auto}
#filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;
  margin-bottom:10px}
#filters label{font-size:12px;color:var(--ink2)}
table{width:100%;border-collapse:collapse;background:var(--panel);
  border:1px solid var(--line);border-radius:10px;overflow:hidden}
th,td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left;
  font-size:13px}
th{color:var(--ink2);font-weight:600;background:var(--bg)}
tbody tr{cursor:pointer}tbody tr:hover{background:var(--bg)}
td.t-date{white-space:nowrap;color:var(--ink2);font-size:12px}
td.t-src,td.t-model{white-space:nowrap;font-size:12px;color:var(--ink2)}
mark{background:var(--mark);color:inherit;border-radius:2px;padding:0 1px}
#pager{display:flex;gap:10px;align-items:center;margin-top:10px;
  color:var(--ink2);font-size:13px}
.turn{border:1px solid var(--line);border-radius:8px;padding:8px 10px;
  margin-bottom:8px;cursor:pointer}
.turn:hover{border-color:var(--accent)}
.turn .no{font-weight:600;margin-right:8px}
.turn .roles{font-size:11px;color:var(--accent);margin-right:8px}
.turn .ts{font-size:11px;color:var(--ink2);float:right}
.turn .prev{color:var(--ink2);font-size:12px;display:block;margin-top:2px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.msg{margin:0 0 10px;border-left:3px solid var(--line);padding:6px 10px;
  border-radius:0 6px 6px 0}
.msg.hit{outline:2px solid var(--accent);border-radius:6px}
.msg .who{font-size:11px;font-weight:600;letter-spacing:.5px}
.msg .body{white-space:pre-wrap;word-break:break-word;margin-top:3px}
.m-user{border-left-color:#2563eb;background:rgba(37,99,235,.07)}
.m-user .who{color:#2563eb}
.m-assistant{border-left-color:#16a34a;background:rgba(22,163,74,.06)}
.m-assistant .who{color:#16a34a}
.m-note{border-left-color:#9aa3b2;background:rgba(154,163,178,.08)}
.m-note .who{color:var(--ink2)}
.m-note .body{font:12px/1.5 Consolas,monospace;color:var(--ink2)}
.m-system{border-left-color:#d97706;background:rgba(217,119,6,.08)}
.m-system .who{color:#d97706}
details summary{cursor:pointer;color:var(--ink2);font-size:12px}
#detail h2{font-size:14px;margin:0 0 4px;display:flex;align-items:center;
  gap:10px}
#detail .sub{color:var(--ink2);font-size:12px;margin-bottom:10px}
.back{font-size:12px;color:var(--accent);cursor:pointer;user-select:none}
.empty{color:var(--ink2);text-align:center;padding:18px 0}
/* ---- v2：工具条 / 锚点 / 徽章 / 报告 ---- */
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;
  margin-bottom:12px}
.toolbar label{font-size:12px;color:var(--ink2)}
.sub2{font-size:12px;color:var(--ink2)}
a.anchor{color:var(--accent);cursor:pointer;text-decoration:none;
  font-family:Consolas,monospace;font-size:12px;white-space:nowrap}
a.anchor:hover{text-decoration:underline}
.pill{display:inline-block;border-radius:9px;padding:0 8px;font-size:11px;
  vertical-align:middle}
.pill.known{background:var(--warn-bg);color:var(--warn-ink)}
.pill.ok{background:var(--ok-bg);color:var(--ok-ink)}
.pill.err{background:var(--err-bg);color:var(--err-ink)}
h3.sec{font-size:14px;margin:18px 0 6px}
.report-box{background:var(--panel);border:1px solid var(--line);
  border-radius:10px;padding:12px 14px;max-width:1100px}
.report-box table{border:none;background:none}
.report-box td,.report-box th{white-space:normal}
.up-card{background:var(--panel);border:1px solid var(--line);
  border-radius:10px;padding:10px 14px;margin-bottom:10px;max-width:1100px}
.up-card h4{margin:0 0 6px;font-size:13px}
.up-card .errline{color:var(--err-ink);font-size:12px}
.up-card .stat{font-size:12px;color:var(--ink2);margin-right:14px}
.num{font-variant-numeric:tabular-nums}
/* 异常徽章：会话列表 error_count>0 橙 / ≥10 红 */
.badge{display:inline-block;margin-left:6px;border-radius:9px;padding:0 7px;
  font-size:11px;vertical-align:1px}
.b-org{background:var(--warn-bg);color:var(--warn-ink)}
.b-red{background:var(--err-bg);color:var(--err-ink)}
/* 导出/复制小按钮 */
.xbtn{font:inherit;font-size:12px;margin-left:8px;cursor:pointer;padding:1px 8px}
/* ---- v0.22 T3-5：主题 tab ---- */
#topics-left{flex:1;min-width:250px;max-width:430px}
#topics-mid{flex:1.15;min-width:280px}
#topics-right{flex:1.4;min-width:0;background:var(--panel);
  border:1px solid var(--line);border-radius:10px;padding:12px 14px;
  display:none;position:sticky;top:64px;max-height:calc(100vh - 80px);
  overflow:auto}
.tl-stage{margin-bottom:10px}
.tl-stage h4{margin:8px 0 4px;font-size:13px}
.tl-node{border:1px solid var(--line);border-radius:8px;padding:6px 10px;
  margin-bottom:6px;cursor:pointer;font-size:13px}
.tl-node:hover{border-color:var(--accent)}
.tl-node .anchor{font-family:Consolas,monospace;font-size:12px;
  color:var(--accent);margin-right:8px}
/* ---- P2-4：命令台（动词面板 v0） ---- */
#tab-cmd main{display:grid;grid-template-columns:250px minmax(320px,1fr) 330px;
  gap:12px;padding:10px 14px;align-items:start}
#cmd-cards{display:flex;flex-direction:column;gap:4px}
.cmd-card{border:1px solid var(--line);border-radius:6px;padding:6px 9px;
  cursor:pointer;background:#fff;text-align:left}
.cmd-card:hover{border-color:var(--accent)}
.cmd-card.on{border-color:var(--accent);background:#eef4ff}
.cmd-card .t{font-weight:600}
.cmd-card .n{font-size:11px;color:var(--sub)}
.tierbadge{display:inline-block;font-size:10px;border-radius:9px;
  padding:1px 6px;margin-left:4px;border:1px solid var(--line);color:var(--sub)}
.tierbadge.A{color:#1a7f37;border-color:#1a7f37}
.tierbadge.B{color:#9a6700;border-color:#9a6700}
.tierbadge.C{color:#a40e26;border-color:#a40e26}
#cmd-params label{display:block;margin:6px 0 2px;font-size:12px;color:var(--sub)}
#cmd-actions{display:flex;flex-direction:column;gap:6px}
.cmd-act{border:1px solid var(--line);border-radius:6px;padding:7px 9px}
.cmd-act.on{border-color:var(--accent);background:#f7faff}
.cmd-act .d{font-size:11px;color:var(--sub)}
.meta-badges{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0;font-size:11px}
.riskchip{border:1px solid var(--line);border-radius:9px;padding:1px 7px;
  color:var(--sub)}
.riskchip.no{color:#a40e26;border-color:#a40e26}
#cmd-params .prow{display:flex;align-items:center;gap:6px;margin:5px 0}
#cmd-params .prow .pn{font-size:12px;color:var(--sub);min-width:74px}
.cmd-cli{font-family:ui-monospace,Consolas,monospace;font-size:11px;
  background:#f6f8fa;border:1px solid var(--line);border-radius:4px;
  padding:5px 7px;word-break:break-all;white-space:pre-wrap}
#job-out{max-height:460px;overflow:auto}
/* ---- v0.34 P1：解释层（结论卡/卡片本体/导语/悬停卡/chips） ---- */
.concl{border:1px solid var(--line);border-left:3px solid var(--accent);
  background:var(--bg);border-radius:8px;padding:8px 12px;margin:10px 0}
.concl .c-judge{font-weight:600}
.concl .c-actions{margin-top:6px;display:flex;gap:6px;flex-wrap:wrap}
.concl .c-actions button{font-size:12px;padding:2px 10px}
.concl .c-sub{color:var(--ink2);font-size:12px;margin-top:4px}
.gterm{text-decoration:underline dotted var(--accent);cursor:help}
#gl-pop{position:fixed;z-index:30;max-width:360px;background:var(--ink);
  color:#fff;border-radius:8px;padding:10px 12px;font-size:12px;
  line-height:1.6;box-shadow:0 4px 16px rgba(0,0,0,.25);display:none}
#gl-pop .t{font-weight:700;margin-bottom:2px}
#gl-pop .ex{color:#c9d4e3;margin-top:4px}
.panel-intro{border:1px dashed var(--line);border-radius:8px;
  padding:6px 10px;margin:0 0 10px;font-size:12px;color:var(--ink2)}
.panel-intro summary{cursor:pointer;color:var(--accent)}
.card-body{border:1px solid var(--line);border-radius:8px;padding:8px 12px;
  margin-bottom:10px}
.card-body h4{margin:0 0 4px;font-size:13px;display:flex;gap:8px;
  align-items:center;flex-wrap:wrap}
.card-body .c-ev{font-family:Consolas,monospace;font-size:12px;
  color:var(--ink2);background:var(--bg);border-radius:6px;
  padding:6px 8px;margin:6px 0;white-space:pre-wrap;word-break:break-word}
.card-body .c-anc{margin-top:4px}
.chip{display:inline-block;border:1px solid var(--line);border-radius:11px;
  padding:1px 10px;font-size:12px;color:var(--ink2);cursor:pointer;
  margin:0 4px 4px 0;user-select:none}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.chip:hover{border-color:var(--accent)}
.chiprow{margin:6px 0}
</style>
</head>
<body>
<header>
  <h1>harvester-view</h1>
  <nav id="tabs">
    <button data-tab="sessions" class="on">会话检索</button>
    <button data-tab="triage">蒸馏队列</button>
    <button data-tab="reports">报告</button>
    <button data-tab="agg">中台</button>
    <button data-tab="topics">主题</button>
    <button data-tab="cmd">命令台</button>
  </nav>
  <select id="upstream" title="切换上游实例"></select>
  <span class="meta" id="meta"></span>
</header>
<div id="banner"></div>

<!-- ============ Tab 1: 会话检索 ============ -->
<section class="tab" id="tab-sessions">
  <main>
  <div id="left">
    <div id="sess-intro"></div>
    <div id="sess-chips" class="chiprow" style="display:none"></div>
    <div id="filters">
      <label>来源 <select id="f-source"><option value="">全部</option></select></label>
      <label>模型 <select id="f-model"><option value="">全部</option></select></label>
      <label>Skill <select id="f-skill"><option value="">全部</option></select></label>
      <label>起 <input type="date" id="f-since"></label>
      <label>止 <input type="date" id="f-until"></label>
      <label>关键字 <input type="search" id="f-q" placeholder="中文/英文词" style="width:150px"></label>
      <label class="sub2"><input type="checkbox" id="f-erronly">只看异常</label>
      <button id="btn-search">查询</button>
    </div>
    <table>
      <thead><tr><th style="width:26px"><input type="checkbox" id="sel-all"
        title="全选/全不选本页（仅勾选含异常的会话）"></th>
        <th style="width:150px">更新时间</th><th style="width:90px">来源</th>
        <th style="width:130px">模型</th><th>标题</th></tr></thead>
      <tbody id="rows"><tr><td colspan="5" class="empty">加载中…</td></tr></tbody>
    </table>
    <div id="pager">
      <button id="btn-prev">上一页</button>
      <button id="btn-next">下一页</button>
      <span id="pageinfo"></span>
      <button id="btn-batch-md" class="xbtn" disabled
        title="勾选多个会话后，批量拉取全文并合并导出 Markdown（每会话一节，标注会话ID+异常类型；浏览器本地完成）">导出所选异常会话 md</button>
      <button id="btn-batch-json" class="xbtn" disabled
        title="勾选多个会话后，导出机器可读 JSON：错误按归一模式跨会话去重聚合，可直接交给 Agent 分析">导出所选机器可读 JSON</button>
      <span class="sub2" id="selinfo"></span>
    </div>
  </div>
  <div id="detail"></div>
  </main>
</section>

<!-- ============ Tab 2: 蒸馏队列 ============ -->
<section class="tab" id="tab-triage" style="display:none">
  <div class="toolbar">
    <label>窗口（天）<input type="number" id="tri-days" value="30" min="0"
      style="width:72px">（0=全库）</label>
    <label>最少次数 <input type="number" id="tri-min" value="2" min="1"
      style="width:60px"></label>
    <label>会话 Top <input type="number" id="tri-top" value="10" min="1"
      style="width:60px"></label>
    <button id="btn-triage">生成队列</button>
    <input type="search" id="tri-q" placeholder="异常关键字过滤（本地过滤）"
      style="width:170px">
    <button id="btn-tri-export" class="xbtn" title="把当前队列导出为 Markdown 文件（浏览器本地生成）">导出 md</button>
    <button id="btn-tri-json" class="xbtn" title="导出机器可读 JSON（含归一模式去重说明），可直接交给 Agent 分析">导出 JSON</button>
    <span class="sub2" id="tri-meta"></span>
  </div>
  <div id="tri-concl"></div>
  <div class="report-box" id="tri-out"><div class="empty">尚未生成</div></div>
</section>

<!-- ============ Tab 3: 报告 ============ -->
<section class="tab" id="tab-reports" style="display:none">
  <div class="toolbar">
    <select id="rep-kind">
      <option value="tools">G1 工具统计</option>
      <option value="errors">G2 错误三分类</option>
      <option value="skills">G4 Skill 行为画像</option>
      <option value="agents">G2 建议条目（AGENTS.md 候选）</option>
      <option value="cards">G3 卡片校验</option>
    </select>
    <label>窗口（天）<input type="number" id="rep-days" value="30" min="0"
      style="width:72px">（0=全库）</label>
    <button id="btn-report">生成报告</button>
    <input type="search" id="rep-q" placeholder="异常关键字过滤（本地过滤）"
      style="width:170px">
    <label class="sub2"><input type="checkbox" id="rep-erronly">只看异常</label>
    <button id="btn-rep-export" class="xbtn" title="把当前报告导出为 Markdown 文件（浏览器本地生成）">导出 md</button>
    <button id="btn-rep-json" class="xbtn" title="导出机器可读 JSON（上游原始结构 + 归一模式去重说明），可直接交给 Agent 分析">导出 JSON</button>
    <span class="sub2" id="rep-meta"></span>
  </div>
  <div id="rep-concl"></div>
  <div class="report-box" id="rep-out"><div class="empty">尚未生成</div></div>
</section>

<!-- ============ Tab 4: 中台 ============ -->
<section class="tab" id="tab-agg" style="display:none">
  <div class="toolbar">
    <input type="search" id="agg-q" placeholder="跨实例搜索关键字（中文/英文词）"
      style="width:240px">
    <button id="btn-agg-search">搜索全部上游</button>
    <button id="btn-agg-facets">刷新 facets 对比</button>
  </div>
  <div id="agg-out"><div class="empty">尚未加载</div></div>
</section>

<!-- ============ Tab 5: 主题（T3-5） ============
  主题清单完全来自 /api/topics（聚合发现后注册，数据驱动，无写死清单）；
  中栏时间线来自 chain 文档 frontmatter 锚点；深挖分层=复制 CLI 命令，
  本视图绝不执行（红线 3）。 -->
<section class="tab" id="tab-topics" style="display:none">
  <main>
  <div id="topics-left">
    <div class="toolbar">
      <button id="btn-topics-refresh">刷新</button>
      <span class="sub2" id="topics-meta"></span>
    </div>
    <div id="topics-intro"></div>
    <div id="topics-list"><div class="empty">加载中…</div></div>
  </div>
  <div id="topics-mid">
    <div class="toolbar" id="topics-toolbar" style="display:none">
      <label>分层 <select id="topic-level">
        <option value="chain">chain 演进链（已生成）</option>
        <option value="title">title 极粗（~2K）</option>
        <option value="coarse">coarse 粗（~10K）</option>
        <option value="mid">mid 中（~30K）</option>
        <option value="fine">fine 细</option>
        <option value="artifact">artifact 产物</option>
      </select></label>
      <button id="btn-topic-cmd" class="xbtn" disabled
        title="复制到剪贴板，请自行开终端粘贴执行（本视图绝不执行命令）">复制命令</button>
    </div>
    <div id="topics-timeline"><div class="empty">← 选择左侧主题</div></div>
  </div>
  <div id="topics-right"><div id="topic-doc"></div></div>
  </main>
</section>

<!-- ============ Tab 6: 命令台（P2-4 动词面板 v0） ============
  数据源：view 仓本地动作面 actions/actionsserve.py（端口 8766，SOP D3）。
  动作一律来自 /api/actions 的**冻结白名单**（A 档）；命令注册表来自
  静态 commands.json 生成的 /api/commands。参数区只渲染 src 指向端点的
  选择器 + chips，**不暴露任何路径类参数**（SOP §5 红线）；C 档命令
  只显示命令行供复制，页面永不执行（红线 3）。 -->
<section class="tab" id="tab-cmd" style="display:none">
  <main>
  <div id="cmd-left">
    <div class="toolbar">
      <button id="btn-cmd-refresh">刷新注册表</button>
      <span class="sub2" id="cmd-meta"></span>
    </div>
    <div id="cmd-cards"><div class="empty">加载中…</div></div>
  </div>
  <div id="cmd-mid">
    <div id="cmd-intro"></div>
    <div id="cmd-head" class="sub2">← 选一张动词卡</div>
    <div id="cmd-actions"></div>
    <div id="cmd-params"></div>
    <div id="cmd-runbar" class="toolbar" style="display:none">
      <button id="btn-cmd-run">执行</button>
      <span id="cmd-est" class="sub2"></span>
    </div>
    <div id="cmd-banner" class="sub2"></div>
    <div id="cmd-browsable"></div>
  </div>
  <div id="cmd-right">
    <h3 class="sec">结果抽屉</h3>
    <div id="job-out"><div class="empty">尚未执行任何动作</div></div>
  </div>
  </main>
</section>

<script>
"use strict";
const $ = id => document.getElementById(id);
const state = {no:0, offset:0, limit:50, total:0, q:"", sid:null,
               tab:"sessions", repKind:"tools", sel:new Set(),
               loaded:{sessions:false, triage:false, reports:false,
                       agg:false, topics:false},
               /* v0.34 P1：解释层与筛选状态（errChip=报告页模式类别，
                  sessChip=会话页类别；errChipRep=全库 errors 报告缓存；

/* 标题命中高亮：把关键字（空格分词）包上 <mark> */
function hl(text,q){

  for(const t of terms){

  return out;
}

/* 数据源：view 仓本地只读服务 viewserver.py（端口 8766，决策 D9）。
   服务未启动时解释层静默降级：页面照常，只是没有导语/悬停/人话。 */
const glossary = {loaded:false, data:null};
async function loadGlossary(){
  if(glossary.loaded)return glossary.data;
  /* 端点在动作面（8766），不是本页 origin（8088）——相对路径会 404。
     见 docs/reports/patch-p2-fix-view-fetch.py 与 tests/render_cmd.js 的门。 */
  const res=await fetch(ACT_BASE+"/view/glossary");
  if(!res.ok)throw new Error("glossary 服务不可用（HTTP "+res.status+"）");
  glossary.data=await res.json();
  glossary.loaded=true;
  return glossary.data;
}
/* 归一模式 → 人话（glossary.patterns 精确匹配；未收录返回空=不显示） */
function patternPlain(p){
  const ps=(glossary.data||{}).patterns||[];
  const hit=ps.find(x=>x.pattern===p);
  return hit?hit.plain:"";
}
const CLASS_LABEL={env:"环境类",tool_interface:"用法类",
  context:"上下文类",unclassified:"未归类"};
function clsLabel(c){return CLASS_LABEL[c]||c;}
/* 术语 → 卡（精确匹配；悬停弹层用） */
function termCard(term){
  const ts=(glossary.data||{}).terms||[];
  return ts.find(x=>x.term===term)||null;
}
/* 给 root 内文本包虚线下划线（每个文本节点最多包第一个命中；已包过/
   弹层/脚本内跳过；≤3 字符纯英文词不包防误伤）。重渲染后由调用方再跑。 */
function applyTermTooltips(root){
  const ts=(glossary.data||{}).terms||[];
  if(!ts.length||!root)return;
  const tw=ts.map(t=>t.term)
    .filter(t=>t&&!(t.length<=3&&/^[A-Za-z0-9_]+$/.test(t)))
    .sort((a,b)=>b.length-a.length);
  if(!tw.length)return;
  const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);
  const nodes=[];
  while(walker.nextNode())nodes.push(walker.currentNode);
  for(const node of nodes){
    const text=node.nodeValue;
    if(!text||text.length<2)continue;
    if(node.parentElement&&node.parentElement.closest&&
       node.parentElement.closest(".gterm,#gl-pop,script,style"))continue;
    let hit=null,hidx=-1;
    for(const t of tw){const i=text.indexOf(t);
      if(i>=0){hit=t;hidx=i;break;}}
    if(!hit)continue;
    const frag=document.createDocumentFragment();
    frag.appendChild(document.createTextNode(text.slice(0,hidx)));
    const span=document.createElement("span");
    span.className="gterm";span.dataset.term=hit;
    span.textContent=hit;
    frag.appendChild(span);
    frag.appendChild(document.createTextNode(text.slice(hidx+hit.length)));
    node.parentNode.replaceChild(frag,node);
  }
}
/* 全局悬停弹层：事件委托一次绑定；滚动即收起 */
(function(){
  let pop=null;
  function ensurePop(){
    if(pop)return pop;
    pop=document.createElement("div");pop.id="gl-pop";
    document.body.appendChild(pop);
    return pop;
  }
  document.addEventListener("mouseover",e=>{
    const el=e.target&&e.target.closest?e.target.closest(".gterm"):null;
    if(!el)return;
    const c=termCard(el.dataset.term);
    if(!c)return;
    const p=ensurePop();
    p.innerHTML="<div class='t'>"+esc(c.term)+"</div>"+esc(c.plain)+
      (c.example?"<div class='ex'>例："+esc(c.example)+"</div>":"");
    p.style.display="block";
    const w=Math.min(360,window.innerWidth-20);
    const r=el.getBoundingClientRect();
    p.style.width=w+"px";
    p.style.left=Math.max(8,Math.min(r.left,window.innerWidth-w-8))+"px";
    p.style.top=Math.min(r.bottom+6,window.innerHeight-140)+"px";
  });
  document.addEventListener("mouseout",e=>{
    if(!pop)return;
    const el=e.target&&e.target.closest?e.target.closest(".gterm"):null;
    if(el)pop.style.display="none";
  });
  document.addEventListener("scroll",()=>{
    if(pop)pop.style.display="none";},true);
})();

/* 动作面（8766）直连：CORS 已在服务端放行；服务没起时黄条 + null，
   命令台据此把动作标成"暂不可执行"（诚实降级，不假装能跑）。 */
const ACT_BASE="http://127.0.0.1:8766";
async function actApi(path,opt){
  try{
    const res=await fetch(ACT_BASE+path,opt);
    const body=await res.json().catch(()=>({}));
    if(!res.ok)return {__err:body.error||("HTTP "+res.status),__status:res.status};
    return body;
  }catch(e){
    return {__err:"动作面不可达（请确认 actionsserve 在 8766 运行）",__net:1};
  }
}
async function actJson(path,obj){
  return actApi(path,{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify(obj)});
}
async function failApi(res){
  let body={}; try{ body=await res.json(); }catch(e){}
  if(body.kind==="unreachable")
    showBanner("warn",(body.error||"上游不可达")+
      "（提示：先在主项目运行 python -m harvester api-serve）");
  else if(body.kind==="version_mismatch")
    showBanner("err",body.error||"上游 API 版本不匹配，请升级对应侧");
  else if(res.status===401)
    showBanner("err","上游鉴权失败：请在 config.json 为该上游配置正确的 token");
  else
    showBanner("err",body.error||("请求失败 (HTTP "+res.status+")"));
  throw new Error(body.error||res.status);
}

/* 锚点直通：打开会话 → 分批并发逐回合定位错误原文 → 高亮命中消息 */
async function gotoAnchor(sid,seq,errText){
  switchTab("sessions");
  await openSession(sid);
  const probe=String(errText||"").replace(/\s+/g," ").trim();
  if(!probe){ showBanner("warn","锚点无错误原文，已打开会话 "
    +sid+"（回合列表中自行定位 step #"+seq+"）"); return; }
  const d=await api("/api/session/"+encodeURIComponent(sid));
  const n=Math.min(d.n_turns||0,80);
  for(let base=1;base<=n;base+=5){
    const batch=[...Array(5)].map((_,i)=>base+i).filter(x=>x<=n);
    const rs=await Promise.all(batch.map(x=>
      api("/api/session/"+encodeURIComponent(sid)+"/turn/"+x)
        .catch(()=>null)));
    for(const t of rs){
      if(!t)continue;
      let idx=(t.messages||[]).findIndex(m=>
        String(m.content||"").replace(/\s+/g," ").includes(probe));
      if(idx<0){ /* 降级：用更短探针再试 */
        const p2=probe.slice(0,30);
        if(p2) idx=(t.messages||[]).findIndex(m=>
          String(m.content||"").replace(/\s+/g," ").includes(p2));
      }
      if(idx>=0){
        await openTurn(sid,t.turn,idx);
        return;
      }
    }
  }
  showBanner("warn","已在会话 "+sid+" 中打开全文检索定位，"
    +"但未找到与错误原文逐字匹配的消息（表述可能经 adapter 改写）——"
    +"可按 step #"+seq+" 在回合列表中人工定位。");
}

function renderSessChips(){

    el.onclick=()=>{state.sessChip=el.dataset.sesschip||"";
      renderSessChips();applySessChipFilter().catch(()=>{});};
}
async function applySessChipFilter(){
  const cls=state.sessChip;
  const rows=[...$("rows").querySelectorAll("tr[data-sid]")];
  if(!cls){
    for(const tr of rows)tr.style.display="";
    return;
  }
  const missing=rows.map(tr=>tr.dataset.sid)
    .filter(sid=>!state.sessClsMap[sid]);
  if(missing.length)
    showBanner("warn","正在核对 "+missing.length+" 个会话的错误类别"+
      "（每会话一次只读查询，稍候…）");
  let done=0;
  for(let i=0;i<missing.length;i+=5){
    await Promise.all(missing.slice(i,i+5).map(async sid=>{
      try{
        const s=await api("/api/session/"+encodeURIComponent(sid));
        state.sessClsMap[sid]=new Set(
          (s.error_steps||[]).map(x=>x["class"]));
      }catch(e){ state.sessClsMap[sid]=new Set(); }
      done++;
    }));
    if(missing.length>10)
      showBanner("warn","正在核对错误类别… "+done+"/"+missing.length);
  }
  const agg={};
  for(const set of Object.values(state.sessClsMap))
    for(const c of set)agg[c]=(agg[c]||0)+1;
  state.sessClsSess=agg;
  let shown=0;
  for(const tr of rows){
    const set=state.sessClsMap[tr.dataset.sid]||new Set();
    const on=!cls||set.has(cls);
    tr.style.display=on?"":"none";
    if(on)shown++;
  }
  hideBanner();
  renderSessChips();
  $("selinfo").textContent="按「"+clsLabel(cls)+"」筛出本页 "+
    shown+"/"+rows.length+" 个会话（条数口径见 chips；明细见 G2 报告）";
}

/* 结论卡纪律（提案 §3.1）：主语+数字+判语+动作，全 if/else+字符串模板，
   数字全部取自本次 API 响应现算，LLM 不进这一层。「环比」暂缺基线字段，

function renderRepConcl(kind,d){
  const box=$("rep-concl");

    const tot=(d.tools||[]).reduce((a,t)=>a+t.calls,0);

    cc=conclusionCard({

          :"窗口内没有工具失败。",ok:!worst}],
      sub:"机械事实：由 /api/reports/tools 现算；「最该先看」=放弃数优先、"+
        "失败数次之的第一名。",
      actions:[{id:"root",label:"看根因",title:"跳到本页根因明细"},

      actions:[{id:"root",label:"看根因",title:"跳到本页模式明细"},

        {id:"cmd",label:"在命令台打开",title:"P2 接入（占位）"}]});
    handlers={root:()=>$("rep-out").scrollIntoView({behavior:"smooth"}),
      bench:()=>{$("rep-kind").value="agents";loadReport(true).catch(()=>{});},
      cmd:()=>showBanner("warn","命令台在 P2 阶段接入（占位）")};
  }else if(kind==="agents"){

    const watch=entries.filter(e=>!(e.unresolved_count>=1)).length;
    const unres=entries.reduce((a,e)=>a+(e.unresolved_count||0),0);
    cc=conclusionCard({
      lines:[{text:"达标条目 "+entries.length+"：待修 "+todo+
        "（未解决错误 "+unres+" 处）、已自愈 "+watch+"。"},
        {text:todo?"待修清单排在最前，逐条带证据锚点；裁决后用 suggest-status 落账。"

        {id:"cmd",label:"在命令台打开",title:"P2 接入（占位）"}]});
    handlers={root:()=>$("rep-out").scrollIntoView({behavior:"smooth"}),

/* ---- 报告/队列的本地异常过滤（v2.3）：不重新请求，仅重渲染 ---- */
function repFilter(){
  return {q:$("rep-q").value.trim().toLowerCase(),
          only:$("rep-erronly").checked};
}
function hitQ(text,q){return !q||String(text||"").toLowerCase().includes(q);}
function renderTools(d,out){
  const f=repFilter();
  /* 异常明细数据面：优先 roots（后端 aggregate_error_roots 已归一聚合，
     v0.21 P0-2 additive）；旧上游无 roots 字段时降级 errors 扁平化。
     计数用真实错误次数累加（旧实现 g.count++ 丢失了明细次数）。 */
  let allErrs=[];
  for(const t of d.tools||[]){
    if(t.roots&&t.roots.length){
      for(const g of t.roots)
        allErrs.push({tool:t.tool,detail:g.pattern,cls:g["class"]||"",
                      count:g.count,sample:g.sample||""});
    }else for(const e of t.errors||[])
      allErrs.push({tool:t.tool,detail:e.detail,cls:"",count:e.count||1,
                    sample:e.detail||""});
  }
  if(f.q)allErrs=allErrs.filter(x=>hitQ(x.tool+" "+x.detail,f.q));
  const byDetail=new Map();
  for(const x of allErrs){
    let g=byDetail.get(x.detail);
    if(!g){g={detail:x.detail,count:0,cls:x.cls,sample:x.sample,
              tools:new Set()};byDetail.set(x.detail,g);}
    g.count+=x.count;g.tools.add(x.tool);
    if(!g.sample&&x.sample)g.sample=x.sample;
  }
  const errs=[...byDetail.values()].map(g=>({...g,tools:[...g.tools]}))
    .sort((a,b)=>b.count-a.count);
  const errTable=()=>{
    let h="<h3 class='sec'>异常根因明细"+(f.q?"（关键字“"+esc(f.q)+"”命中）":"")+
      "（按次数倒序；同根因已归并——模式已去路径/引号/数字差异）</h3>";
    h+=errs.length?("<table><thead><tr><th class='num'>次数</th>"+
      "<th>根因模式</th><th>类别</th><th>工具</th><th>样例</th></tr></thead><tbody>"+
      errs.slice(0,80).map(e=>"<tr><td class='num'>"+e.count+"</td><td class='sub2'>"+
      esc(e.detail)+"</td><td>"+esc(e.cls)+"</td><td>"+
      esc(e.tools.join("/"))+"</td><td class='sub2'>"+
      esc(e.sample.slice(0,160))+"</td></tr>").join("")+"</tbody></table>")
      :"<div class='empty'>无命中</div>";
    return h;
  };
  if(f.only||f.q){
    $("rep-meta").textContent+="｜过滤后异常根因 "+errs.length+" 条";
    out.innerHTML=errTable();
    return;
  }
  const tot=d.tools.reduce((a,t)=>a+t.calls,0);
  const err=d.tools.reduce((a,t)=>a+t.error,0);
  const given=d.tools.reduce((a,t)=>a+(t.given_up||0),0);
  $("rep-meta").textContent="工具 "+d.tools.length+"｜调用 "+tot+
    "｜失败 "+err+"（"+(tot?(err/tot*100).toFixed(1):0)+"%）｜放弃 "+given;
  /* 归一后行结构：raw_tools 附原始写法；given_up>0 徽章；low-sample 徽章 */
  const rawTip=t=>(t.raw_tools||[]).filter(x=>x!==t.tool);
  const lowBadge=t=>t.low_sample?"<span class='badge b-org' "+
    "title='样本量低于阈值，结论仅供观察'>low-sample</span>":"";
  let html="<h3 class='sec'>工具失败率排行</h3><table><thead><tr>"+
    "<th>工具</th><th class='num'>调用</th><th class='num'>成功</th>"+
    "<th class='num'>失败</th><th class='num'>失败率</th>"+
    "<th class='num'>放弃</th></tr></thead><tbody>"+
    (d.tools.length?d.tools.map(t=>{
      const rt=rawTip(t);
      const gnum=t.given_up?"<span class='badge b-red' "+
        "title='错误后同会话同工具无再次调用（未解决）'>"+t.given_up+"</span>"
        :"0";
      return "<tr><td>"+esc(t.tool)+
      (rt.length?"<span class='sub2'>（"+esc(rt.join("/"))+"）</span>":"")+
      lowBadge(t)+
      "</td><td class='num'>"+t.calls+"</td><td class='num'>"+t.success+
      "</td><td class='num'>"+t.error+"</td><td class='num'>"+
      (t.fail_rate*100).toFixed(1)+"%</td><td class='num'>"+gnum+
      "</td></tr>";}).join("")
    :"<tr><td colspan='6' class='empty'>无工具调用数据</td></tr>")+
    "</tbody></table>";
  if(d.flow&&d.flow.errors){
    const f=d.flow;
    html+="<h3 class='sec'>失败后续行为（重试/放弃）</h3><p class='sub2'>"+
      "失败 "+f.errors+" 次：重试 "+f.retried+"（"+
      (f.errors?f.retried/f.errors*100:0).toFixed(0)+"%）｜ 放弃 "+
      f.given_up+"（"+(f.errors?f.given_up/f.errors*100:0).toFixed(0)+
      "%）——高放弃率+高失败率=用户路径被硬性挡断，优先修。</p>";
  }
  const srcs=Object.keys(d.by_source||{});
  if(srcs.length){
    html+="<h3 class='sec'>按 Agent（数据源）分布</h3>";
    for(const s of srcs){
      const o=d.by_source[s];
      html+="<details><summary>"+esc(s)+"（调用 "+o.calls+"｜失败 "+
        o.errors+"）</summary><table><thead><tr><th>工具</th>"+
        "<th class='num'>调用</th><th class='num'>失败</th>"+
        "<th class='num'>失败率</th></tr></thead><tbody>"+
        o.tools.map(t=>"<tr><td>"+esc(t.tool)+"</td><td class='num'>"+
        t.calls+"</td><td class='num'>"+t.error+"</td><td class='num'>"+
        (t.fail_rate*100).toFixed(1)+"%</td></tr>").join("")+
        "</tbody></table></details>";
    }
  }
  /* v0.21 P0-2：默认视图也渲染聚合根因（不再只藏在过滤态） */
  if(errs.length)html+=errTable();
  out.innerHTML=html;
}
function renderErrors(d,out){
  const m=d.meta||{};
  $("rep-meta").textContent="错误 "+(m.error_count||0)+" / 总步骤 "+
    (m.total_steps||0)+"｜涉及 "+(m.sessions||0)+" 会话"+
    (m.since?("｜窗口 ≥ "+m.since):"");
  const cls=d.by_class||{};
  const n=m.error_count||0;
  const CLS=[["env","环境：沙箱/权限/OS/网络/宿主限制，agent 无法自愈"],
    ["tool_interface","用法：参数错/先改后读/盲猜行号，改用法即消"],
    ["context","目标状态：文件已删/资产失效，需重新侦察"],
    ["unclassified","未命中规则，需人工归因后补规则"]];
  let html="<h3 class='sec'>三分类分布</h3><table><thead><tr><th>类别</th>"+
    "<th class='num'>次数</th><th class='num'>占比</th><th>语义</th>"+
    "</tr></thead><tbody>"+CLS.map(c=>"<tr><td>"+c[0]+"</td><td class='num'>"+
    (cls[c[0]]||0)+"</td><td class='num'>"+
    (n?((cls[c[0]]||0)/n*100).toFixed(0):0)+"%</td><td class='sub2'>"+
    c[1]+"</td></tr>").join("")+"</tbody></table>";
  const bk=d.by_bucket||{};
  html+="<h3 class='sec'>轨迹位置分桶</h3><p class='sub2'>开场（前1/3）"+
    (bk["开场"]||0)+"｜中途（中1/3）"+(bk["中途"]||0)+"｜收尾（后1/3）"+
    (bk["收尾"]||0)+"——开场高发=环境/权限未就绪；收尾高发=收尾动作踩坑。</p>";
  const srcs=d.by_source||{};
  if(Object.keys(srcs).length>1){
    html+="<h3 class='sec'>按 Agent（数据源）分布</h3><table><thead><tr>"+
      "<th>数据源</th><th class='num'>env</th><th class='num'>tool_interface</th>"+
      "<th class='num'>context</th><th class='num'>unclassified</th></tr></thead><tbody>"+
      Object.entries(srcs).map(e=>"<tr><td>"+esc(e[0])+"</td><td class='num'>"+
      (e[1].env||0)+"</td><td class='num'>"+(e[1].tool_interface||0)+
      "</td><td class='num'>"+(e[1].context||0)+"</td><td class='num'>"+
      (e[1].unclassified||0)+"</td></tr>").join("")+"</tbody></table>";
  }
  // P1-3 additive：交叉表 class × harness × model（旧上游无 cross 字段时降级不渲染）
  const cross=d.cross||[];
  if(cross.length){
    html+="<h3 class='sec'>数据源 × model × 错误类别交叉表</h3><table><thead><tr>"+
      "<th>数据源</th><th>model</th><th class='num'>env</th>"+
      "<th class='num'>tool_interface</th><th class='num'>context</th>"+
      "<th class='num'>unclassified</th><th class='num'>合计</th>"+
      "</tr></thead><tbody>"+cross.map(r=>"<tr><td>"+esc(r.source)+
      "</td><td>"+esc(r.model||"（未知）")+"</td><td class='num'>"+(r.env||0)+
      "</td><td class='num'>"+(r.tool_interface||0)+"</td><td class='num'>"+
      (r.context||0)+"</td><td class='num'>"+(r.unclassified||0)+
      "</td><td class='num'>"+(r.total||0)+"</td></tr>").join("")+
      "</tbody></table><p class='sub2'>首行=最多坑组合（API 序，合计降序）；"
      +"model「（未知）」=会话未携带模型信息（导出型源无 model 字段）。</p>";
  }
  html+="<h3 class='sec'>错误模式明细（归一聚类，锚点可点击）</h3>";
  const f=repFilter();
  let pats=d.patterns||[];
  if(f.q)pats=pats.filter(x=>hitQ(x.pattern+" "+x.tools.join("/"),f.q));
  pats=[...pats].sort((a,b)=>b.count-a.count);
  /* P1-5：类别 chips（点击=按类别过滤本表；条数与 by_class 同源） */
  if(pats.length){
    /* chips 数字口径=错误事件条数（与上方三分类 by_class 同值同源），
       「全部」=各模式 count 求和≡by_class 求和（真实载荷门对账①钉住）；
       chips 过滤的是下方模式行（行数=模式数，两种数字各司其职）。 */
    const clsCount={};
    for(const x of pats)clsCount[x["class"]]=(clsCount[x["class"]]||0)+x.count;
    const evTotal=pats.reduce((a,x)=>a+x.count,0);
    const cur=(typeof state!=="undefined"&&state.errChip&&
               clsCount[state.errChip])?state.errChip:"";
    html+="<div class='chiprow'>"+
      "<span class='chip"+(cur?"":" on")+"' data-errchip=''>全部 "+
      evTotal+"</span>"+
      Object.entries(clsCount).sort((a,b)=>b[1]-a[1]).map(e=>
        "<span class='chip"+(cur===e[0]?" on":"")+
        "' data-errchip='"+esc(e[0])+"'>"+esc(clsLabel(e[0]))+" "+
        e[1]+"</span>").join("")+"</div>";
    if(cur)pats=pats.filter(x=>x["class"]===cur);
  }
  html+=pats.length?("<table><thead><tr><th class='num'>次数</th>"+
    "<th>模式</th><th>类别</th><th>工具</th><th>样例锚点</th></tr></thead><tbody>"+
    pats.slice(0,60).map(x=>{
      const pl=patternPlain(x.pattern);   /* P1-1 模式人话（未收录不显示） */
      return "<tr><td class='num'><a href='javascript:void(0)' class='anchor'"+
      " data-pat2=\""+esc(x.pattern)+"\" title='把本模式命中的**全部**会话"+
      "列出来（数字皆门第二跳；样例只有 3 条，代表不了全部）'>x"+
      x.count+"</a></td><td>"+esc(x.pattern)+
      (pl?"<div class='sub2'>人话："+esc(pl)+"</div>":"")+"</td><td>"+
      esc(x["class"])+"</td><td>"+esc(x.tools.join("/"))+"</td><td>"+
      x.samples.map(s=>anchor(s.sid,s.seq,s.error)).join("<br>")+
      "<div class='sub2'><a href='javascript:void(0)' class='anchor' "+
      "data-pat2=\""+esc(x.pattern)+"\">会话列表 →</a></div>"+
      "</td></tr>";}).join("")+"</tbody></table>")
    :"<div class='empty'>steps 表无错误记录</div>";
  out.innerHTML=html;
  for(const el of out.querySelectorAll("[data-errchip]"))
    el.onclick=()=>{if(typeof state==="undefined")return;
      state.errChip=el.dataset.errchip||"";
      if(state.repLast)renderErrors(state.repLast,out);};
  if(typeof bindPatternDrill==="function")bindPatternDrill(out);
}
/* P2-5 第二跳入口接线：模式次数 / 「会话列表 →」都通向命中会话清单 */

        "「"+esc(a)+"」").join("、")+"</p>";

        const i=a.lastIndexOf("#");
        return anchor(a.slice(0,i),a.slice(i+1),"");

    html+="</details>";
  }
  out.innerHTML=html;

function renderAgents(d,out){

  const watch=entries.filter(e=>!(e.unresolved_count>=1)).filter(hitE);

    "<th>规则句</th><th>owner</th><th>证据锚点</th></tr></thead><tbody>"+
    watch.map(e=>"<tr><td class='num'>x"+e.total+"</td><td><b>"+
    esc(e.title)+"</b> "+statusPill(e.status)+"</td><td>"+
    ownerPill(e.owner)+"</td><td>"+
    e.samples.slice(0,2).map(s=>anchor(s.sid,s.seq,s.error)).join("<br>")+
    "</td></tr>").join("")+"</tbody></table>")
    :"<div class='empty'>无</div>";
  html+="<h3 class='sec'>待人工归因（未命中模板，给证据不给结论）</h3>";
  html+=leftover.length?("<table><thead><tr><th class='num'>次数</th>"+
    "<th>模式</th><th>类别</th><th>未解决</th><th>样例锚点</th></tr></thead><tbody>"+
    leftover.map(x=>"<tr><td class='num'>x"+x.count+"</td><td>"+
    esc(x.pattern)+"</td><td>"+esc(x["class"])+"</td><td class='num'>"+

    "</td><td>"+

function renderCards(d,out){
  const s=d.summary||{};
  const f=repFilter();
  const stat=s.error?("<span class='pill err'>错误 "+s.error+"</span>")
    :s.warn?("<span class='pill known'>警告 "+s.warn+"</span>")
    :"<span class='pill ok'>全部通过</span>";
  let html="<p>"+stat+"　<span class='sub2'>通过 "+s.ok+"｜警告 "+
    s.warn+"｜错误 "+s.error+"</span></p>";
  let bad=(d.cards||[]).filter(c=>c.errors.length||c.warnings.length);
  /* "只看异常"在 G3 的语义=只看错误级（警告级也不看）；关键字命中路径或问题文本 */
  if(f.only)bad=bad.filter(c=>c.errors.length);

    c.errors.concat(c.warnings).join(" "),f.q));

    "</thead><tbody>"+bad.map(c=>"<tr><td>"+esc(c.path)+"</td><td>"+

      .join("<br>")+"</td></tr>").join("")+"</tbody></table>")
    :"<div class='empty'>"+(filtered&&s.cards?

  const bodies=(typeof state!=="undefined"&&state.cardsBodies)||[];
  if(!bodies.length){
    html+="<div class='empty'>本体数据未加载——在 view 仓运行 "+

  }else{
    const byPath={};
    for(const b of bodies)byPath[b.path]=b;
    const unbodied=(d.cards||[]).filter(c=>!byPath[c.path]);
    if(unbodied.length)
      html+="<div class='empty'>"+unbodied.length+
        " 张卡无本体（校验有、本体缺）："+

        (unbodied.length>3?"…":"")+"</div>";
    for(const b of bodies){
      const v=(d.cards||[]).find(c=>c.path===b.path);
      const errs=v?v.errors:[], warns=v?v.warnings:[];

        :warns.length?"<span class='pill known'>校验警告 "+warns.length+
        "</span>":"<span class='pill ok'>校验通过</span>";
      html+="<div class='card-body'><h4>"+esc(b.title||b.id||b.path)+" "+vp+
        (b.confidence!=null?"<span class='pill known' "+
          "title='卡片蒸馏时的置信度'>置信度 "+b.confidence+"</span>":"")+
        (b.type?"<span class='sub2'>"+esc(b.type)+"</span>":"")+"</h4>";
      if(b.conclusion)html+="<div>"+esc(b.conclusion)+"</div>";

      if(b.anchors&&b.anchors.length)
        html+="<div class='c-anc'>"+b.anchors.map(a=>

}

/* 一个主题可以有多条 chain（后端 v0.25 起返回 chains[]；旧上游只有单链 → 兼容）。
   idx 选择渲染第几条；多链时顶部给切换按钮（本视图只渲染，不执行任何命令）。 */
function renderChain(d,out,idx){
  const list=(d.chains&&d.chains.length)?d.chains:[d];
  const i=Math.max(0,Math.min(Number(idx||0),list.length-1));
  const cur=list[i]||{},fm=cur.fm||{};
  const stages=fm.anchors||[];
  const nNodes=stages.reduce((a,s)=>a+((s.nodes||[]).length),0);
  const cnt=c=>Number(c.stages!==undefined?c.stages:((c.fm&&c.fm.anchors)||[]).length);
  const nn=c=>Number(c.nodes!==undefined?c.nodes:0);
  const sw=list.length>1
    ?("<div class='toolbar' id='chain-switch'><span class='sub2'>本主题 "+
       list.length+" 条链：</span>"+list.map((c,k)=>
       "<button class='xbtn' data-chain-idx=\""+k+"\""+(k===i?" disabled":"")+
       ">"+esc(c.name||("chain-"+(k+1)))+"（"+cnt(c)+"阶段/"+nn(c)+
       "节点）</button>").join(" ")+"</div>")
    :"";
  $("topic-doc").innerHTML=
    "<h2>"+esc(fm.topic||d.topic_id||"主题")+" · chain 长文</h2>"+
    (list.length>1?"<div class='sub2'>本条链："+esc(cur.name||"")+"</div>":"")+
    "<div class='sub'>成员 "+((fm.members||[]).length)+"｜锚点 "+nNodes+
    (cur.chain_path?"｜产物 "+esc(cur.chain_path):"")+"</div>"+
    (fm.db_fingerprint?"<div class='sub2'>快照指纹 "+
      esc(JSON.stringify(fm.db_fingerprint)).slice(0,140)+"</div>":"")+
    "<div style='white-space:pre-wrap;word-break:break-word;margin-top:10px'>"+
    esc(cur.body||d.body||"")+"</div>";
  let h=sw+"<h3 class='sec'>演进时间线（"+stages.length+" 阶段 / "+
    nNodes+" 锚点）</h3>"+
    "<p class='sub2'>点节点跳回原会话对应回合（任一节点一键回原文）；"+
    "深挖分层用上方「复制命令」，由 CLI 生成蒸馏包——本视图绝不执行。</p>";
  for(const st of stages){
    h+="<div class='tl-stage'><h4>"+esc(st.stage||"")+
      (st.span?" <span class='sub2'>"+esc(st.span)+"</span>":"")+"</h4>";
    for(const nd of st.nodes||[])
      h+="<div class='tl-node' data-sid=\""+esc(nd.sid)+"\" data-turn=\""+
        Number(nd.turn||0)+"\"><span class='anchor'>"+esc(nd.sid)+"#"+
        Number(nd.turn||0)+"</span>"+esc(nd.note||"")+"</div>";
    h+="</div>";
  }
  if(!stages.length)h+="<div class='empty'>该 chain 无锚点数据</div>";
  out.innerHTML=h;
}

/* ---------- 导出与复制（全部浏览器本地完成；本视图绝不执行命令） ---------- */
function dlText(filename,text){
  const b=new Blob([text],{type:"text/markdown;charset=utf-8"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(b);a.download=filename;
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),3000);
}
/* 机器可读导出：JSON 下载（浏览器本地完成） */
function dlJson(filename,obj){
  const b=new Blob([JSON.stringify(obj,null,1)],
    {type:"application/json;charset=utf-8"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(b);a.download=filename;
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),3000);
}
async function copyText(text,btn){
  try{ await navigator.clipboard.writeText(text); }
  catch(e){ /* file:// 或旧浏览器降级 */
    const ta=document.createElement("textarea");
    ta.value=text;document.body.appendChild(ta);ta.select();
    document.execCommand("copy");ta.remove();
  }
  if(btn){const old=btn.textContent;btn.textContent="已复制";
    setTimeout(()=>{btn.textContent=old;},1200);}
}
function today(){return new Date().toISOString().slice(0,10);}
function cell(x){return String(x??"").replace(/\|/g,"\\|").replace(/\n/g," ");}
function mdTable(head,rows){
  return "| "+head.join(" | ")+" |\n|"+head.map(()=>"---").join("|")+
    "|\n"+rows.map(r=>"| "+r.map(cell).join(" | ")+" |").join("\n")+"\n";
}

/* 报告 → Markdown（与页面渲染同口径） */
function mdReport(kind,d){
  let md="# harvester 报告";
  if(kind==="tools"){
    md+="：G1 工具统计\n\n"+mdTable(["工具","调用","成功","失败","失败率","放弃"],
      (d.tools||[]).map(t=>[t.tool+
        ((t.raw_tools||[]).filter(x=>x!==t.tool).length?
          "（"+t.raw_tools.filter(x=>x!==t.tool).join("/")+"）":"")+
        (t.low_sample?" [low-sample]":""),
        t.calls,t.success,t.error,
        (t.fail_rate*100).toFixed(1)+"%",t.given_up||0]));
    const f=d.flow;
    if(f&&f.errors)md+="\n失败后续：重试 "+f.retried+"（"+
      (f.retried/f.errors*100).toFixed(0)+"%）｜放弃 "+f.given_up+"（"+
      (f.given_up/f.errors*100).toFixed(0)+"%）\n";
    for(const s of Object.keys(d.by_source||{})){
      const o=d.by_source[s];
      md+="\n## 按源："+s+"（调用 "+o.calls+"｜失败 "+o.errors+"）\n\n"+
        mdTable(["工具","调用","失败","失败率"],
        (o.tools||[]).map(t=>[t.tool,t.calls,t.error,
          (t.fail_rate*100).toFixed(1)+"%"]));
    }
  }else if(kind==="errors"){
    const m=d.meta||{};
    md+="：G2 错误三分类\n\n- 错误 "+(m.error_count||0)+" / 总步骤 "+
      (m.total_steps||0)+"｜涉及 "+(m.sessions||0)+" 会话\n\n";
    md+=mdTable(["类别","次数"],
      Object.entries(d.by_class||{}).map(e=>[e[0],e[1]]));
    md+="\n"+mdTable(["轨迹位置","次数"],
      Object.entries(d.by_bucket||{}).map(e=>[e[0],e[1]]));
    md+="\n## 错误模式明细\n\n"+mdTable(["次数","模式","类别","工具"],
      (d.patterns||[]).map(x=>["x"+x.count,x.pattern,x["class"],
        x.tools.join("/")]));
  }else if(kind==="skills"){
    md+="：G4 Skill 行为画像（调用 "+d.n_invocations+" 次）\n\n"+
      mdTable(["Skill","调用","会话","成功","失败","无结果","来源"],
      (d.skills||[]).map(s=>[s.skill,s.calls,s.sids,s.ok,s.err,
        s.no_result,s.sources.join("/")]));
  }else if(kind==="agents"){
    md+="：G2 建议条目（AGENTS.md 候选）\n";
    const todo=(d.entries||[]).filter(e=>(e.unresolved_count||0)>=1);
    const watch=(d.entries||[]).filter(e=>!(e.unresolved_count>=1));
    if(todo.length){
      md+="\n## 待修清单（未解决 >= 1）\n";
      for(const e of todo)
        md+="\n### "+e.title+"（owner: "+(e.owner||"?")+
          "｜status: "+(e.status||"pending")+"）\n\n"+e.body+
          "\n\n（实测 x"+e.total+"｜未解决 "+e.unresolved_count+"）\n";
    }
    if(watch.length){
      md+="\n## 观察区（未解决 = 0，已自愈）\n";
      for(const e of watch)
        md+="\n### "+e.title+"（owner: "+(e.owner||"?")+
          "｜status: "+(e.status||"pending")+"）\n\n（实测 x"+e.total+"）\n";
    }
    md+="\n## 未达标 pattern（供参考）\n\n"+
      mdTable(["次数","模式","类别","未解决"],
      (d.leftover||[]).map(x=>["x"+x.count,x.pattern,x["class"],
        x.given_up||0]));
  }else if(kind==="cards"){
    const s=d.summary||{};
    md+="：G3 卡片校验（"+d.root+"）\n\n- 通过 "+(s.ok||0)+"｜警告 "+
      (s.warn||0)+"｜错误 "+(s.error||0)+"｜锚点校验 "+
      (s.anchor_checked||0)+"（未命中 "+(s.anchor_misses||0)+"）\n";
    for(const c of (d.cards||[]).filter(c=>c.errors.length||c.warnings.length))
      md+="\n## "+c.path+"\n\n"+
        c.errors.map(e=>"- 错误："+e).concat(
        c.warnings.map(w=>"- 警告："+w)).join("\n")+"\n";
  }
  return md;
}

    renderCmdCards();
    $("cmd-banner").innerHTML="<span class='errline'>动作面不可达："+
      esc(reg.__err)+"</span>　（起 start-viewv2.cmd 会在 8766 启动它；"+
      "命令注册表与选择器仍可用，但执行按钮会保持禁用）";
    const cmds=await actApi("/api/commands");
    state.act.commands=cmds.__err?null:cmds;
    renderCmdActions();renderCmdParams();
    return;
  }
  const cmds=await actApi("/api/commands");
  state.act={loaded:true,actions:reg.actions||[],
             commands:cmds.__err?null:cmds,error:null};
  if(meta)meta.textContent="动作 "+(reg.actions||[]).length+" 个｜harvester "+
    (reg.harvester_version||"?")+"｜命令 "+
    ((state.act.commands&&state.act.commands.commands||[]).length)+" 条";
  if(manual)showBanner("warn","命令注册表已刷新（动作面 + 静态注册表）");
  renderCmdCards();renderCmdActions();
  renderCmdBrowsable();
  if(state.cmdCard)renderCmdParams();
}

function cmdCommands(){
  return (state.act.commands&&state.act.commands.commands)||[];
}
function renderCmdCards(){
  const box=$("cmd-cards");
  const cmds=cmdCommands();
  if(!cmds.length){
    box.innerHTML=errorBox(state.act.error?("动作面不可达："+state.act.error)
      :"命令注册表为空");
    return;
  }
  const cards=(state.act.commands.cards||[]).slice()
    .sort((a,b)=>(a.order||0)-(b.order||0));
  let h="";
  for(const c of cards){
    const n=cmds.filter(x=>x.card_id===c.card_id);
    const nA=n.filter(x=>x.tier==="A").length;
    h+="<button class='cmd-card"+(state.cmdCard===c.card_id?" on":"")+
      "' data-card=\""+esc(c.card_id)+"\"><span class='t'>"+esc(c.label)+
      "</span><span class='tierbadge "+esc(c.tier)+"'>"+tierLabel(c.tier)+
      "</span><div class='n'>"+n.length+" 命令"+
      (nA?("（"+nA+" 可直接执行）"):"（只给命令）")+"</div></button>";
  }
  box.innerHTML=h;
  for(const b of box.querySelectorAll("[data-card]"))
    b.onclick=()=>{
      state.cmdCard=b.dataset.card;
      const first=cmdCommands().find(x=>x.card_id===state.cmdCard);
      state.actionId=null;state.cmdParams={};state.chain=[];
      renderCmdCards();renderCmdActions();renderCmdParams();
      if(first)selectCmdCommand(first.cmd);
    };
}

function renderCmdActions(){
  const box=$("cmd-actions");
  if(!state.cmdCard){box.innerHTML="";$("cmd-head").textContent="← 选一张动词卡";return;}
  const cmds=cmdCommands().filter(x=>x.card_id===state.cmdCard);
  $("cmd-head").innerHTML="动词卡："+esc((state.act.commands.cards||[])
    .find(c=>c.card_id===state.cmdCard)?.label||state.cmdCard)+
    "（"+cmds.length+" 条命令）——挑一条查看参数";
  let h="<div class='chiprow'>"+cmds.map(c=>
    "<span class='chip"+(state.actionId===c.cmd?" on":"")+"' data-cmd=\""+
    esc(c.cmd)+"\">"+esc(c.cmd)+" <span class='tierbadge "+esc(c.tier)+"'>"+
    c.tier+"</span></span>").join("")+"</div>";
  const cur=cmds.find(c=>c.cmd===state.actionId);
  if(!cur){
    h+="<div class='sub2'>点上面的命令名选择；A 档可在本页直接跑，"+
       "B/C 档只生成命令行（红线：命令台不是万能 shell）。</div>";
  }else{
    if(cur.help)h+="<div class='sub2'>"+esc(cur.help)+"</div>";
    if(cur.subactions&&cur.subactions.length)
      h+="<div class='sub2'>子动作（档位各不相同）："+cur.subactions.map(s=>
        esc(s.name)+"<span class='tierbadge "+esc(s.tier)+"'>"+s.tier+
        "</span>").join(" ")+"</div>";
  }
  box.innerHTML=h;
  for(const el of box.querySelectorAll("[data-cmd]"))
    el.onclick=()=>selectCmdCommand(el.dataset.cmd);
}

function selectCmdCommand(name){
  state.actionId=name;state.cmdParams={};state.chain=[];
  const c=cmdCommands().find(x=>x.cmd===name);
  for(const a of (c&&c.args)||[]){
    if(a.src==="chips"&&a.default!==null&&a.default!==undefined)
      state.cmdParams[a.dest]=a.default;
  }
  renderCmdActions();renderCmdParams();
}

/* 参数选择器：src=none → 文本框；chips → 预设按钮；枚举 → 下拉。
   src=server（路径类）**刻意不渲染**（SOP §5 红线）；
   topics_api / sessions_api 由"浏览数据"面板给可选项（见 renderCmdBrowsable）。 */
function renderCmdParams(){
  const box=$("cmd-params");
  const cur=cmdCommands().find(c=>c.cmd===state.actionId);
  if(!cur){box.innerHTML="";$("cmd-runbar").style.display="none";return;}
  const vis=(cur.args||[]).filter(a=>a.src!=="server"&&a.kind!=="switch");
  let h=vis.length?"<h3 class='sec'>参数（"+esc(cur.cmd)+"）</h3>":"";
  for(const a of vis){
    const val=state.cmdParams[a.dest];
    h+="<div class='prow'><span class='pn'>"+esc(a.name)+"</span>";
    if(a.src==="chips"&&a.kind==="enum"){
      h+="<select data-p=\""+esc(a.dest)+"\"><option value=''>（缺省）</option>"+
        (a.choices||[]).map(c=>"<option"+(String(val)===c?" selected":"")+
        ">"+esc(c)+"</option>").join("")+"</select>";
    }else if(a.src==="chips"){
      h+="<input type='number' data-p=\""+esc(a.dest)+"\" style='width:90px' "+
        "value='"+(val===undefined||val===null?"":esc(val))+"' "+
        "placeholder='缺省=全库'>";
    }else{
      h+="<input data-p=\""+esc(a.dest)+"\" style='width:230px' value='"+
        esc(val===undefined||val===null?"":val)+"' placeholder='"+
        (a.choices?esc(a.choices.slice(0,6).join("|")):"自由文本")+"'>";
    }
    if(a.choices&&a.src!=="chips")
      h+="<span class='sub2'>可选："+esc(a.choices.join(" / "))+"</span>";
    if(a.note)h+="<span class='sub2'>"+esc(a.note)+"</span>";
    h+="</div>";
  }
  const skipped=(cur.args||[]).filter(a=>a.src==="server");
  if(skipped.length)
    h+="<div class='sub2'>"+skipped.length+" 个路径类参数由服务端起服时"+
       "确定（命令台不暴露路径，免得把库指错）："+
       esc(skipped.map(a=>a.name).join(" / "))+"</div>";
  box.innerHTML=h;
  for(const el of box.querySelectorAll("[data-p]")){
    const ev=el.tagName==="SELECT"?"change":"input";
    el.addEventListener(ev,()=>{
      let v=el.value;
      if(v==="")delete state.cmdParams[el.dataset.p];
      else if(el.type==="number")state.cmdParams[el.dataset.p]=Number(v);
      else state.cmdParams[el.dataset.p]=v;
      updateCmdPreview();
    });
  }
  updateCmdPreview();
}

/* 预演命令行：与真实 CLI 同形（页面不执行它，只是让人核对参数对不对）。 */
function cmdLine(c,params){
  let s="python -m harvester "+c.cmd;
  for(const a of c.args||[]){
    if(a.src==="server")continue;
    const v=params[a.dest];
    if(v===undefined)continue;
    if(a.kind==="switch"){s+=" "+a.name;continue;}
    s+=" "+a.name+" "+String(v);
  }
  return s;
}
function updateCmdPreview(){
  const c=cmdCommands().find(x=>x.cmd===state.actionId);
  const bar=$("cmd-runbar"),banner=$("cmd-banner");
  if(!c){bar.style.display="none";banner.innerHTML="";return;}
  /* 分支**必须**按"有没有可执行动作"来分，不能只按档位：A 档也有尚未
     实现动作的命令（白名单 3 个 vs 注册表 43 条），直接读 act.est_sec
     会整页抛错（2026-10-12 由 tests/render_cmd.js 实测抓出）。 */
  const act=A_ACTIONS()[actionForCommand(c.cmd)];
  const cmdHtml="<div class='cmd-cli'>"+esc(cmdLine(c,state.cmdParams))+
    "</div>";
  bar.style.display="";
  if(act&&c.tier==="A"){
    $("btn-cmd-run").disabled=false;
    $("btn-cmd-run").textContent="执行（进程内调用 harvester，非 shell）";
    $("cmd-est").textContent="预估 ~"+act.est_sec+"s｜"+act.reversible+
      "｜写入："+(act.writes||"无（只读）");
  }else{
    $("btn-cmd-run").disabled=true;
    $("btn-cmd-run").textContent="本命令不可在页面执行";
    const why=c.tier==="C"
      ? "C 档：要占端口常驻／要人亲手登录——只生成命令（红线 3）"
      : (c.tier==="B"
         ? "B 档：会写库，需两段提交确认（P3-2 才提供）"
         : "A 档，但动作面的白名单里还没有这条（现有 "+
           Object.keys(A_ACTIONS()).length+" 个）");
    $("cmd-est").textContent=why+"｜请复制下方命令自行执行";
  }
  banner.innerHTML=cmdHtml;
}
/* 命令名 → 动作 id：只映**已实现**的 A 档动作（不猜、不造）。
   写成函数而不是 const 表：本仓的渲染门（tests/render_cmd.js）只 extract
   `function name(...)` 形态的源码——`const` 顶层表 extract 不到，映射就
   落在门的保护之外（"门绿但映射被删"）。 */
function cmdActionMap(){
  return {"report-tools":"report_tools","report-errors":"report_errors",
    "topic":"topic_list"};
}
function actionForCommand(cmd){return cmdActionMap()[cmd]||null;}
function A_ACTIONS(){
  const m={};
  for(const a of state.act.actions||[])m[a.action_id]=a;
  return m;
}

async function runCmdAction(){
  const c=cmdCommands().find(x=>x.cmd===state.actionId);
  const aid=actionForCommand(c&&c.cmd);
  if(!c||!aid){showBanner("warn","这条命令没有已实现的 A 档动作");return;}
  const act=A_ACTIONS()[aid];
  const params={};
  for(const k of Object.keys(act.params||{}))
    if(state.cmdParams[k]!==undefined)params[k]=state.cmdParams[k];
  $("job-out").innerHTML="<div class='empty'>已入队，等待结果…</div>";
  const started=Date.now();
  const r=await actJson("/api/actions/run",{action_id:aid,params:params,
    view_actions_api:1});
  if(r.__err){showBanner("err","执行失败："+r.__err);
    $("job-out").innerHTML=errorBox(r.__err);return;}
  state.job={id:r.job_id,est:r.est_sec,t0:started,label:c.cmd};
  $("job-out").innerHTML="<div class='sub2'>已入队 "+esc(r.job_id)+
    "（预估 ~"+esc(String(r.est_sec))+"s）——页面可关，回来还能查</div>";
  pollCmdJob(r.job_id);
}

async function pollCmdJob(jid){
  const job=await actApi("/api/actions/job/"+jid);
  if(job.__err){showBanner("warn","作业查询失败："+job.__err);return;}
  const el=$("job-out");
  const secs=((Date.now()-(state.job?state.job.t0:Date.now()))/1000).toFixed(1);
  if(job.status==="queued"||job.status==="running"){
    el.innerHTML="<div class='sub2'>"+esc(job.label||"")+" 执行中…"+" 已用 "+
      secs+"s（预估 ~"+esc(String(state.job?state.job.est:"?"))+"s）</div>";
    setTimeout(()=>pollCmdJob(jid),400);
    return;
  }
  if(job.status==="failed"){
    el.innerHTML="<div class='errline'>失败："+esc(job.error||"")+"</div>"+
      (job.traceback?"<details><summary>traceback</summary><pre>"+
       esc(job.traceback)+"</pre></details>":"");
    showBanner("err","动作失败："+(job.error||""));
    return;
  }
  el.innerHTML="<div class='sub2'>完成：用时 "+((job.elapsed_ms||0)/1000)
    .toFixed(2)+"s｜"+esc(job.label||"")+"</div>"+jobResultHtml(job);
  showBanner("warn","动作完成："+(job.label||"")+"（结果在右侧抽屉）");
  if(glossary.loaded)applyTermTooltips(el);
}
/* 结果渲染：**数字皆门**——能点开的数字都给出口，不打印一整坨 JSON。
   （原始 JSON 永远可在下面展开，机器口径不丢。） */
function jobResultHtml(job){
  const r=job.result||{};
  let h="";
  if(r.topics){
    h+="<div class='sub2'>主题 "+r.topics.length+" 个</div><table><thead><tr>"+
      "<th>主题</th><th class='num'>成员</th></tr></thead><tbody>"+
      r.topics.map(t=>"<tr><td>"+esc(t.name)+"<div class='sub2'>"+
        esc(t.id)+"</div></td><td class='num'>"+t.members_count+
        "</td></tr>").join("")+"</tbody></table>";
  }else if(r.tools||r.by_class||r.patterns){
    const m=r.meta||{};
    h+="<div class='sub2'>库快照："+(r.db_fingerprint?
      (r.db_fingerprint.sessions+" 会话 / "+r.db_fingerprint.steps+
       " 步骤 / "+r.db_fingerprint.errors+" 错误 @ "+
       esc(r.db_fingerprint.db_mtime)):"—")+"</div>";
    if(r.meta&&r.meta.error_count!==undefined)
      h+="<div>错误 "+m.error_count+" 条 / 总步骤 "+m.total_steps+
        "｜涉及 "+m.sessions+" 会话</div>";
    const cls=r.by_class||{};
    h+="<table><thead><tr><th>类别</th><th class='num'>次数</th></tr></thead>"+
      "<tbody>"+Object.entries(cls).sort((a,b)=>b[1]-a[1]).map(e=>
      "<tr><td>"+esc(clsLabel(e[0]))+"</td><td class='num'>"+e[1]+
      "</td></tr>").join("")+"</tbody></table>";
    const pats=(r.patterns||[]).slice(0,8);
    if(pats.length)
      h+="<div class='sub2'>模式 Top "+pats.length+"（点次数看命中会话）</div>"+
        pats.map(p=>"<div>"+esc(p.pattern)+" "+
        "<a href='javascript:void(0)' data-pat=\""+esc(p.pattern)+
        "\" class='anchor'>x"+p.count+"</a></div>").join("");
  }
  h+="<details><summary>原始 JSON</summary><pre style='max-height:260px;"+
    "overflow:auto;font-size:11px'>"+esc(JSON.stringify(r,null,1).slice(0,20000))+
    "</pre></details>";
  setTimeout(()=>{
    const el=$("job-out");
    for(const a of el.querySelectorAll("[data-pat]"))
      a.onclick=()=>showPatternSessions(a.dataset.pat);
  },0);
  return h;
}
/* ---------- P2-5 数字皆门（三跳） ----------
   一跳 错误报告的模式行（次数 xN）→ 二跳 命中会话清单 →
   三跳 会话回合原文（startThreeHop）。
   数字对账纪律：二跳的 count 与一跳的模式 count **同源**（都是
   errstats.normalize_error 归一后计数），逐会话次数之和必须等于总数；
   任一跳断了都只能说"断在哪"，不许两边各显示一个数糊过去。 */
async function showPatternSessions(pattern,backTo){
  const out=$("rep-out");
  out.innerHTML="<div class='empty'>取模式「"+esc(pattern)+"」的命中会话…</div>";
  const d=await actApi("/api/pattern-sessions?pattern="+
    encodeURIComponent(pattern));
  if(d.__err){out.innerHTML=errorBox("第二跳失败："+d.__err+
    "（需要动作面在 8766 运行）");return;}
  renderPatternSessions(d,out,backTo);
  showBanner("warn","第二跳：模式「"+pattern+"」命中 "+d.sessions_count+
    " 会话（共 "+d.count+" 次）");
}
function renderPatternSessions(d,out,backTo){
  const sum=(d.sessions||[]).reduce((a,s)=>a+s.occurrences,0);
  const ok=sum===d.count;
  let h="<h3 class='sec'>第二跳 · 模式命中会话："+esc(d.pattern)+"</h3>"+
    "<p class='sub2'>本模式共 <b>x"+d.count+"</b> 次，分布在 <b>"+
    d.sessions_count+"</b> 个会话；其中未解决（失败后同工具再未调用）<b>"+
    d.given_up+"</b> 次。<br>逐会话次数之和 = <b>"+sum+"</b> "+
    (ok?("<span class='c-judge'>与模式总数一致 ✓</span>")
       :("<span class='errline'>与模式总数 "+d.count+" 不一致 ✗"+
          "（数字对账断了，先别下结论）</span>"))+
    "。点会话名进第三跳（回合原文，经既有 gotoAnchor 直通高亮）。</p>"+
    "<div class='toolbar'><button id='btn-pat-back'>← 回错误报告</button>"+
    "<span class='sub2'>轨迹：错误模式 → 会话列表 → 回合原文</span>"+
    "</div><table><thead><tr><th>会话</th><th class='num'>次数</th>"+
    "<th class='num'>未解决</th><th>工具</th></tr></thead><tbody>"+
    (d.sessions||[]).map(s=>"<tr><td><a href='javascript:void(0)' "+
      "class='anchor' data-sid=\""+esc(s.sid)+"\" data-seq=\""+
      Number(s.sample_seq||0)+"\" data-err=\""+esc(s.sample_error||"")+
      "\">"+esc(s.title||shortSid(s.sid))+"</a><div class='sub2'>"+
      esc((s.updated_at||"").slice(0,10))+"</div></td>"+
      "<td class='num'>"+s.occurrences+"</td><td class='num'>"+
      (s.given_up?"<span class='errline'>"+s.given_up+"</span>":"0")+
      "</td><td>"+esc((s.tools||[]).join("/"))+"</td></tr>").join("")+
          "</tbody></table>";
  out.innerHTML=h;
  $("btn-pat-back").onclick=()=>(backTo?rerenderReport():switchTab("reports"));
  bindAnchors(out);
  if(glossary.loaded)applyTermTooltips(out);
}
/* 第三跳：会话 → 回合原文。**刻意不自己拼 turn 号**：steps.seq 是库内
   步骤序号，与 api_turn 的回合号 n 不是同一口径，直接拿 seq 当 n 会跳错
   回合（且错得很安静）。复用既有 gotoAnchor——它按**错误原文逐字**扫回合
   并高亮命中消息，扫不到就诚实说"表述可能经 adapter 改写"。 */
function startThreeHop(sid,seq,errText){
  if(!sid){showBanner("warn","第三跳缺会话 id（第二跳数据不完整）");return;}
  if(typeof gotoAnchor!=="function")return;
  gotoAnchor(sid,seq||0,errText||"").catch(e=>
    showBanner("err","第三跳失败："+e.message));
}

/* 浏览数据：给参数区提供"从库里来的选择器"（SOP §5.5）。
   只读、按需取；不可达时退化为无面板（参数仍可手输，但页面会提示）。 */
function renderCmdBrowsable(){
  const box=$("cmd-browsable");
  if(!box)return;
  box.innerHTML="<h3 class='sec'>从库里选（只读）</h3>"+
    "<div class='toolbar'><button id='btn-cmd-topics'>载入主题清单</button>"+
    "<button id='btn-cmd-sids'>载入最近异常会话</button></div>"+
    "<div id='cmd-pick' class='sub2'>点上面按钮把可选值取回来——"+
    "命令台的参数不该靠人背（SOP §5.5）。</div>";
  $("btn-cmd-topics").onclick=async()=>{
    $("cmd-pick").textContent="取主题…";
    try{
      const d=await api("/api/topics");
      state.topicPick=d;
      $("cmd-pick").innerHTML="主题 "+(d.topics||[]).length+" 个："+
        (d.topics||[]).map(t=>"<span class='chip' data-topicid=\""+
          esc(t.id)+"\">"+esc(t.name)+" ("+t.members_count+")</span>").join(" ");
      for(const el of $("cmd-pick").querySelectorAll("[data-topicid]"))
        el.onclick=()=>{state.cmdParams["id_"]=el.dataset.topicid;
          state.cmdParams["id"]=el.dataset.topicid;
          showBanner("warn","已选主题 "+el.dataset.topicid+
            "（参数已填入下方输入框，可直接核对命令行）");};
    }catch(e){$("cmd-pick").textContent="取主题失败："+e.message;}
  };
  $("btn-cmd-sids").onclick=async()=>{
    $("cmd-pick").textContent="取会话…";
    try{
      const d=await api("/api/sessions?errors_only=1&limit=20");
      state.sidPick=d;
      $("cmd-pick").innerHTML="最近异常会话 "+(d.items||[]).length+" 个："+
        (d.items||[]).map(s=>"<span class='chip' data-picksid=\""+
          esc(s.sid)+"\">"+esc(String(s.title||s.sid).slice(0,18))+
          "</span>").join(" ");
      for(const el of $("cmd-pick").querySelectorAll("[data-picksid]"))
        el.onclick=()=>{state.cmdParams["sid"]=el.dataset.picksid;
          state.cmdParams["sids"]=el.dataset.picksid;
          showBanner("warn","已选会话（参数已填入，核对命令行后再执行）");};
    }catch(e){$("cmd-pick").textContent="取会话失败："+e.message;}
  };
}

$("btn-batch-json").onclick=()=>exportAnalysis("sessions","json")
  .catch(e=>showBanner("err","批量导出失败："+e.message));
/* 报告/队列的本地过滤：不重新请求上游，直接重渲染（triage 需重取后本地过滤） */
function rerenderReport(){
  if(!state.repLast)return;
  const out=$("rep-out"), kind=state.repKind;
  if(kind==="tools")renderTools(state.repLast,out);
  else if(kind==="errors")renderErrors(state.repLast,out);
  else if(kind==="skills")renderSkills(state.repLast,out);
  else if(kind==="agents")renderAgents(state.repLast,out);
  else if(kind==="cards")renderCards(state.repLast,out);
  bindAnchors(out);
  if(glossary.loaded)applyTermTooltips(out);
}
$("rep-q").addEventListener("input",rerenderReport);
$("rep-erronly").onchange=rerenderReport;
$("tri-q").addEventListener("input",()=>{
  if(state.loaded.triage)loadTriage(false).catch(()=>{});});
/* 机器可读导出（报告/队列）：上游 JSON 原始结构 + 去重说明头 */
function machineWrap(kind,d){
  return {kind:kind, generated_at:new Date().toISOString(),
    hint:"harvester-view 导出的机器可读快照（上游 API 原始结构）。"+
      "errors/patterns 已在上游按归一模式去重聚类（pattern 为归一键；"+
      "samples 含 (sid,seq) 锚点，可回溯原会话原文），可直接交给 Agent 分析。",
    data:d};
}
$("btn-prev").onclick=()=>{state.offset=Math.max(0,state.offset-state.limit);
  loadSessions().catch(()=>{});};
$("btn-next").onclick=()=>{state.offset+=state.limit;
  loadSessions().catch(()=>{});};
$("btn-triage").onclick=()=>loadTriage(true).catch(()=>{});
$("btn-report").onclick=()=>loadReport(true).catch(()=>{});
$("rep-kind").onchange=()=>loadReport().catch(()=>{});
$("btn-agg-search").onclick=()=>loadAggSearch().catch(()=>{});
$("agg-q").addEventListener("keydown",e=>{
  if(e.key==="Enter")$("btn-agg-search").click();});
$("btn-agg-facets").onclick=()=>loadAggFacets().catch(()=>{});
$("btn-topics-refresh").onclick=()=>loadTopics().catch(()=>{});
$("topic-level").onchange=()=>updateTopicCmd();
$("btn-topic-cmd").onclick=e=>{
  const b=e.currentTarget;
  if(b.dataset.cmd)copyText(b.dataset.cmd,b);};
$("btn-rep-export").onclick=()=>{
  if(!state.repLast){showBanner("warn","请先点“生成报告”再导出");return;}
  /* P1-4：tools/errors/skills 改调统一导出端点（md/JSON 同源）；
     agents/cards 端点未覆盖，保留本地拼装 */
  if(["tools","errors","skills"].includes(state.repKind)){
    exportAnalysis(state.repKind,"md")
      .catch(e=>showBanner("err","导出失败："+e.message));
    return;
  }
  dlText("harvester-report-"+state.repKind+"-"+today()+".md",
    mdReport(state.repKind,state.repLast));
};
$("btn-rep-json").onclick=()=>{
  if(!state.repLast){showBanner("warn","请先点“生成报告”再导出");return;}
  if(["tools","errors","skills"].includes(state.repKind)){
    exportAnalysis(state.repKind,"json")
      .catch(e=>showBanner("err","导出失败："+e.message));
    return;
  }
  dlJson("harvester-report-"+state.repKind+"-"+today()+".json",
    machineWrap("report-"+state.repKind,state.repLast));
};
$("btn-tri-export").onclick=()=>{
  if(!state.triLast){showBanner("warn","请先点“生成队列”再导出");return;}
  exportAnalysis("triage","md")
    .catch(e=>showBanner("err","导出失败："+e.message));
};
$("btn-tri-json").onclick=()=>{
  if(!state.triLast){showBanner("warn","请先点“生成队列”再导出");return;}
  exportAnalysis("triage","json")
    .catch(e=>showBanner("err","导出失败："+e.message));
};

$("btn-cmd-refresh").onclick=()=>loadCmdData(true).catch(()=>{});
$("btn-cmd-run").onclick=()=>runCmdAction()
  .catch(e=>showBanner("err","执行失败："+e.message));

initUpstreams().then(()=>{
  state.no=Number($("upstream").value||0);
  loadAll();
}).catch(e=>showBanner("err","初始化失败: "+e));
</script>
</body>

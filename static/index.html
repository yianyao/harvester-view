<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>harvester-view</title>
<style>
:root{
  --bg:#f6f7f9;--panel:#fff;--ink:#1c2330;--ink2:#5b6472;--line:#dde2ea;
  --accent:#2563eb;--mark:#ffe58f;--warn-bg:#fff7d6;--warn-ink:#8a6d00;
  --err-bg:#fde8e8;--err-ink:#a12622;--ok-bg:#e6f4ea;--ok-ink:#1a7a3d;
}
@media (prefers-color-scheme: dark){
  :root{--bg:#14171c;--panel:#1d2129;--ink:#e6e9ef;--ink2:#9aa3b2;
        --line:#313845;--accent:#5b8def;--mark:#8a6d00;--warn-bg:#3a3212;
        --warn-ink:#ffd666;--err-bg:#3c1a1a;--err-ink:#ff9b9b;
        --ok-bg:#173325;--ok-ink:#7ed6a2;}
}
*{box-sizing:border-box}
body{margin:0;font:14px/1.55 "Segoe UI",system-ui,-apple-system,
  "Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink)}
header{display:flex;align-items:center;gap:12px;padding:10px 16px;
  background:var(--panel);border-bottom:1px solid var(--line);
  position:sticky;top:0;z-index:5;flex-wrap:wrap}
header h1{font-size:16px;margin:0;font-weight:600}
header .meta{color:var(--ink2);font-size:12px;margin-left:auto}
#tabs{display:flex;gap:2px}
#tabs button{border:none;background:none;border-radius:6px;padding:6px 12px;
  color:var(--ink2);cursor:pointer;font-size:13px}
#tabs button:hover{color:var(--ink)}
#tabs button.on{background:var(--bg);color:var(--accent);font-weight:600}
select,input,button{font:inherit;color:inherit;background:var(--panel);
  border:1px solid var(--line);border-radius:6px;padding:5px 8px}
button{cursor:pointer}button:hover{border-color:var(--accent)}
button:disabled{opacity:.45;cursor:not-allowed}
#banner{display:none;margin:10px 16px 0;padding:9px 12px;border-radius:8px;
  font-size:13px}
#banner.warn{display:block;background:var(--warn-bg);color:var(--warn-ink)}
#banner.err{display:block;background:var(--err-bg);color:var(--err-ink)}
main{display:flex;gap:14px;padding:14px 16px;align-items:flex-start}
section.tab{padding:14px 16px}
#left{flex:1.25;min-width:0}
#detail{flex:1;min-width:0;background:var(--panel);border:1px solid
  var(--line);border-radius:10px;padding:12px 14px;display:none;
  position:sticky;top:64px;max-height:calc(100vh - 80px);
  overflow:auto}
#filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;
  margin-bottom:10px}
#filters label{font-size:12px;color:var(--ink2)}
table{width:100%;border-collapse:collapse;background:var(--panel);
  border:1px solid var(--line);border-radius:10px;overflow:hidden}
th,td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left;
  font-size:13px}
th{color:var(--ink2);font-weight:600;background:var(--bg)}
tbody tr{cursor:pointer}tbody tr:hover{background:var(--bg)}
td.t-date{white-space:nowrap;color:var(--ink2);font-size:12px}
td.t-src,td.t-model{white-space:nowrap;font-size:12px;color:var(--ink2)}
mark{background:var(--mark);color:inherit;border-radius:2px;padding:0 1px}
#pager{display:flex;gap:10px;align-items:center;margin-top:10px;
  color:var(--ink2);font-size:13px}
.turn{border:1px solid var(--line);border-radius:8px;padding:8px 10px;
  margin-bottom:8px;cursor:pointer}
.turn:hover{border-color:var(--accent)}
.turn .no{font-weight:600;margin-right:8px}
.turn .roles{font-size:11px;color:var(--accent);margin-right:8px}
.turn .ts{font-size:11px;color:var(--ink2);float:right}
.turn .prev{color:var(--ink2);font-size:12px;display:block;margin-top:2px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.msg{margin:0 0 10px;border-left:3px solid var(--line);padding:6px 10px;
  border-radius:0 6px 6px 0}
.msg.hit{outline:2px solid var(--accent);border-radius:6px}
.msg .who{font-size:11px;font-weight:600;letter-spacing:.5px}
.msg .body{white-space:pre-wrap;word-break:break-word;margin-top:3px}
.m-user{border-left-color:#2563eb;background:rgba(37,99,235,.07)}
.m-user .who{color:#2563eb}
.m-assistant{border-left-color:#16a34a;background:rgba(22,163,74,.06)}
.m-assistant .who{color:#16a34a}
.m-note{border-left-color:#9aa3b2;background:rgba(154,163,178,.08)}
.m-note .who{color:var(--ink2)}
.m-note .body{font:12px/1.5 Consolas,monospace;color:var(--ink2)}
.m-system{border-left-color:#d97706;background:rgba(217,119,6,.08)}
.m-system .who{color:#d97706}
details summary{cursor:pointer;color:var(--ink2);font-size:12px}
#detail h2{font-size:14px;margin:0 0 4px;display:flex;align-items:center;
  gap:10px}
#detail .sub{color:var(--ink2);font-size:12px;margin-bottom:10px}
.back{font-size:12px;color:var(--accent);cursor:pointer;user-select:none}
.empty{color:var(--ink2);text-align:center;padding:18px 0}
/* ---- v2：工具条 / 锚点 / 徽章 / 报告 ---- */
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;
  margin-bottom:12px}
.toolbar label{font-size:12px;color:var(--ink2)}
.sub2{font-size:12px;color:var(--ink2)}
a.anchor{color:var(--accent);cursor:pointer;text-decoration:none;
  font-family:Consolas,monospace;font-size:12px;white-space:nowrap}
a.anchor:hover{text-decoration:underline}
.pill{display:inline-block;border-radius:9px;padding:0 8px;font-size:11px;
  vertical-align:middle}
.pill.known{background:var(--warn-bg);color:var(--warn-ink)}
.pill.ok{background:var(--ok-bg);color:var(--ok-ink)}
.pill.err{background:var(--err-bg);color:var(--err-ink)}
h3.sec{font-size:14px;margin:18px 0 6px}
.report-box{background:var(--panel);border:1px solid var(--line);
  border-radius:10px;padding:12px 14px;max-width:1100px}
.report-box table{border:none;background:none}
.report-box td,.report-box th{white-space:normal}
.up-card{background:var(--panel);border:1px solid var(--line);
  border-radius:10px;padding:10px 14px;margin-bottom:10px;max-width:1100px}
.up-card h4{margin:0 0 6px;font-size:13px}
.up-card .errline{color:var(--err-ink);font-size:12px}
.up-card .stat{font-size:12px;color:var(--ink2);margin-right:14px}
.num{font-variant-numeric:tabular-nums}
/* 异常徽章：会话列表 error_count>0 橙 / ≥10 红 */
.badge{display:inline-block;margin-left:6px;border-radius:9px;padding:0 7px;
  font-size:11px;vertical-align:1px}
.b-org{background:var(--warn-bg);color:var(--warn-ink)}
.b-red{background:var(--err-bg);color:var(--err-ink)}
/* 导出/复制小按钮 */
.xbtn{font:inherit;font-size:12px;margin-left:8px;cursor:pointer;padding:1px 8px}
/* ---- v0.22 T3-5：主题 tab ---- */
#topics-left{flex:1;min-width:250px;max-width:430px}
#topics-mid{flex:1.15;min-width:280px}
#topics-right{flex:1.4;min-width:0;background:var(--panel);
  border:1px solid var(--line);border-radius:10px;padding:12px 14px;
  display:none;position:sticky;top:64px;max-height:calc(100vh - 80px);
  overflow:auto}
.tl-stage{margin-bottom:10px}
.tl-stage h4{margin:8px 0 4px;font-size:13px}
.tl-node{border:1px solid var(--line);border-radius:8px;padding:6px 10px;
  margin-bottom:6px;cursor:pointer;font-size:13px}
.tl-node:hover{border-color:var(--accent)}
.tl-node .anchor{font-family:Consolas,monospace;font-size:12px;
  color:var(--accent);margin-right:8px}
</style>
</head>
<body>
<header>
  <h1>harvester-view</h1>
  <nav id="tabs">
    <button data-tab="sessions" class="on">会话检索</button>
    <button data-tab="triage">蒸馏队列</button>
    <button data-tab="reports">报告</button>
    <button data-tab="agg">中台</button>
    <button data-tab="topics">主题</button>
  </nav>
  <select id="upstream" title="切换上游实例"></select>
  <span class="meta" id="meta"></span>
</header>
<div id="banner"></div>

<!-- ============ Tab 1: 会话检索 ============ -->
<section class="tab" id="tab-sessions">
  <main>
  <div id="left">
    <div id="filters">
      <label>来源 <select id="f-source"><option value="">全部</option></select></label>
      <label>模型 <select id="f-model"><option value="">全部</option></select></label>
      <label>Skill <select id="f-skill"><option value="">全部</option></select></label>
      <label>起 <input type="date" id="f-since"></label>
      <label>止 <input type="date" id="f-until"></label>
      <label>关键字 <input type="search" id="f-q" placeholder="中文/英文词" style="width:150px"></label>
      <label class="sub2"><input type="checkbox" id="f-erronly">只看异常</label>
      <button id="btn-search">查询</button>
    </div>
    <table>
      <thead><tr><th style="width:26px"><input type="checkbox" id="sel-all"
        title="全选/全不选本页（仅勾选含异常的会话）"></th>
        <th style="width:150px">更新时间</th><th style="width:90px">来源</th>
        <th style="width:130px">模型</th><th>标题</th></tr></thead>
      <tbody id="rows"><tr><td colspan="5" class="empty">加载中…</td></tr></tbody>
    </table>
    <div id="pager">
      <button id="btn-prev">上一页</button>
      <button id="btn-next">下一页</button>
      <span id="pageinfo"></span>
      <button id="btn-batch-md" class="xbtn" disabled
        title="勾选多个会话后，批量拉取全文并合并导出 Markdown（每会话一节，标注会话ID+异常类型；浏览器本地完成）">导出所选异常会话 md</button>
      <button id="btn-batch-json" class="xbtn" disabled
        title="勾选多个会话后，导出机器可读 JSON：错误按归一模式跨会话去重聚合，可直接交给 Agent 分析">导出所选机器可读 JSON</button>
      <span class="sub2" id="selinfo"></span>
    </div>
  </div>
  <div id="detail"></div>
  </main>
</section>

<!-- ============ Tab 2: 蒸馏队列 ============ -->
<section class="tab" id="tab-triage" style="display:none">
  <div class="toolbar">
    <label>窗口（天）<input type="number" id="tri-days" value="30" min="0"
      style="width:72px">（0=全库）</label>
    <label>最少次数 <input type="number" id="tri-min" value="2" min="1"
      style="width:60px"></label>
    <label>会话 Top <input type="number" id="tri-top" value="10" min="1"
      style="width:60px"></label>
    <button id="btn-triage">生成队列</button>
    <input type="search" id="tri-q" placeholder="异常关键字过滤（本地过滤）"
      style="width:170px">
    <button id="btn-tri-export" class="xbtn" title="把当前队列导出为 Markdown 文件（浏览器本地生成）">导出 md</button>
    <button id="btn-tri-json" class="xbtn" title="导出机器可读 JSON（含归一模式去重说明），可直接交给 Agent 分析">导出 JSON</button>
    <span class="sub2" id="tri-meta"></span>
  </div>
  <div class="report-box" id="tri-out"><div class="empty">尚未生成</div></div>
</section>

<!-- ============ Tab 3: 报告 ============ -->
<section class="tab" id="tab-reports" style="display:none">
  <div class="toolbar">
    <select id="rep-kind">
      <option value="tools">G1 工具统计</option>
      <option value="errors">G2 错误三分类</option>
      <option value="skills">G4 Skill 行为画像</option>
      <option value="agents">G2 建议条目（AGENTS.md 候选）</option>
      <option value="cards">G3 卡片校验</option>
    </select>
    <label>窗口（天）<input type="number" id="rep-days" value="30" min="0"
      style="width:72px">（0=全库）</label>
    <button id="btn-report">生成报告</button>
    <input type="search" id="rep-q" placeholder="异常关键字过滤（本地过滤）"
      style="width:170px">
    <label class="sub2"><input type="checkbox" id="rep-erronly">只看异常</label>
    <button id="btn-rep-export" class="xbtn" title="把当前报告导出为 Markdown 文件（浏览器本地生成）">导出 md</button>
    <button id="btn-rep-json" class="xbtn" title="导出机器可读 JSON（上游原始结构 + 归一模式去重说明），可直接交给 Agent 分析">导出 JSON</button>
    <span class="sub2" id="rep-meta"></span>
  </div>
  <div class="report-box" id="rep-out"><div class="empty">尚未生成</div></div>
</section>

<!-- ============ Tab 4: 中台 ============ -->
<section class="tab" id="tab-agg" style="display:none">
  <div class="toolbar">
    <input type="search" id="agg-q" placeholder="跨实例搜索关键字（中文/英文词）"
      style="width:240px">
    <button id="btn-agg-search">搜索全部上游</button>
    <button id="btn-agg-facets">刷新 facets 对比</button>
  </div>
  <div id="agg-out"><div class="empty">尚未加载</div></div>
</section>

<!-- ============ Tab 5: 主题（T3-5） ============
  主题清单完全来自 /api/topics（聚合发现后注册，数据驱动，无写死清单）；
  中栏时间线来自 chain 文档 frontmatter 锚点；深挖分层=复制 CLI 命令，
  本视图绝不执行（红线 3）。 -->
<section class="tab" id="tab-topics" style="display:none">
  <main>
  <div id="topics-left">
    <div class="toolbar">
      <button id="btn-topics-refresh">刷新</button>
      <span class="sub2" id="topics-meta"></span>
    </div>
    <div id="topics-list"><div class="empty">加载中…</div></div>
  </div>
  <div id="topics-mid">
    <div class="toolbar" id="topics-toolbar" style="display:none">
      <label>分层 <select id="topic-level">
        <option value="chain">chain 演进链（已生成）</option>
        <option value="title">title 极粗（~2K）</option>
        <option value="coarse">coarse 粗（~10K）</option>
        <option value="mid">mid 中（~30K）</option>
        <option value="fine">fine 细</option>
        <option value="artifact">artifact 产物</option>
      </select></label>
      <button id="btn-topic-cmd" class="xbtn" disabled
        title="复制到剪贴板，请自行开终端粘贴执行（本视图绝不执行命令）">复制命令</button>
    </div>
    <div id="topics-timeline"><div class="empty">← 选择左侧主题</div></div>
  </div>
  <div id="topics-right"><div id="topic-doc"></div></div>
  </main>
</section>

<script>
"use strict";
const $ = id => document.getElementById(id);
const state = {no:0, offset:0, limit:50, total:0, q:"", sid:null,
               tab:"sessions", repKind:"tools", sel:new Set(),
               loaded:{sessions:false, triage:false, reports:false,
                       agg:false, topics:false}};

/* ---------- 工具 ---------- */
function esc(s){return String(s??"").replace(/[&<>"']/g,
  c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
/* 标题命中高亮：把关键字（空格分词）包上 <mark> */
function hl(text,q){
  let out=esc(text);
  const terms=String(q||"").trim().split(/\s+/).filter(Boolean).map(esc);
  for(const t of terms){
    const re=new RegExp(t.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"),"gi");
    out=out.replace(re,m=>"<mark>"+m+"</mark>");
  }
  return out;
}
function showBanner(kind,msg){const b=$("banner");b.className=kind;
  b.textContent=msg;}
function hideBanner(){const b=$("banner");b.className="";b.textContent="";}
function daysVal(id){const v=Number($(id).value||0);return v>0?v:0;}
/* 锚点链接（sid#seq，可点 → 会话下钻并定位错误原文） */
function anchor(sid,seq,err){
  return "<a class='anchor' data-sid='"+esc(sid)+"' data-seq='"+Number(seq)+
    "' data-err='"+esc(err||"")+"' href='javascript:void(0)'>"+
    esc(sid)+"#"+seq+"</a>";
}
function bindAnchors(root){
  for(const a of root.querySelectorAll("a.anchor"))
    a.onclick=()=>gotoAnchor(a.dataset.sid,Number(a.dataset.seq),
                             a.dataset.err||"");
}
function errorBox(msg){return "<div class='empty'>"+esc(msg)+"</div>";}

/* ---------- API 访问（经本地代理） ---------- */
async function api(path){
  let res;
  try{ res=await fetch("/u/"+state.no+path); }
  catch(e){ showBanner("warn","本地代理不可达？请确认 view.py 正在运行");
            throw e; }
  if(res.ok){ hideBanner(); return res.json(); }
  return failApi(res);
}
async function apiAll(path){ /* /u/all/* 聚合端点 */
  let res;
  try{ res=await fetch(path); }
  catch(e){ showBanner("warn","本地代理不可达？请确认 view.py 正在运行");
            throw e; }
  if(res.ok){ hideBanner(); return res.json(); }
  return failApi(res);
}
/* 文本响应（P1-4：export-analysis format=md 的 text/markdown 出口） */
async function apiText(path){
  let res;
  try{ res=await fetch("/u/"+state.no+path); }
  catch(e){ showBanner("warn","本地代理不可达？请确认 view.py 正在运行");
            throw e; }
  if(res.ok){ hideBanner(); return res.text(); }
  return failApi(res);
}
/* P1-4 统一分析导出：view 端只做下载，md/JSON 拼装与去重全在端点侧
   （/api/export-analysis，SOP-P1-4） */
async function exportAnalysis(kind,fmt){
  const q=new URLSearchParams({kind:kind,format:fmt});
  if(kind==="sessions"){
    const sids=[...state.sel];
    if(!sids.length){showBanner("warn","请先勾选要导出的异常会话");return;}
    q.set("sids",sids.join(","));
  }
  const base="harvester-"+kind+"-"+today();
  if(fmt==="json"){
    dlJson(base+".json",await api("/api/export-analysis?"+q.toString()));
  }else{
    dlText(base+".md",
      await apiText("/api/export-analysis?"+q.toString()));
  }
  showBanner("warn","已导出 "+kind+"（"+fmt+"，浏览器下载）");
}
async function failApi(res){
  let body={}; try{ body=await res.json(); }catch(e){}
  if(body.kind==="unreachable")
    showBanner("warn",(body.error||"上游不可达")+
      "（提示：先在主项目运行 python -m harvester api-serve）");
  else if(body.kind==="version_mismatch")
    showBanner("err",body.error||"上游 API 版本不匹配，请升级对应侧");
  else if(res.status===401)
    showBanner("err","上游鉴权失败：请在 config.json 为该上游配置正确的 token");
  else
    showBanner("err",body.error||("请求失败 (HTTP "+res.status+")"));
  throw new Error(body.error||res.status);
}

/* ---------- Tab 切换 ---------- */
function switchTab(name){
  state.tab=name;
  for(const b of document.querySelectorAll("#tabs button"))
    b.classList.toggle("on",b.dataset.tab===name);
  for(const sec of document.querySelectorAll("section.tab"))
    sec.style.display=sec.id==="tab-"+name?"":"none";
  if(!state.loaded[name]){
    state.loaded[name]=true;
    if(name==="sessions") loadAll().catch(()=>{});
    if(name==="triage") loadTriage().catch(()=>{});
    if(name==="reports") loadReport().catch(()=>{});
    if(name==="agg") loadAggFacets().catch(()=>{});
    if(name==="topics") loadTopics().catch(()=>{});
  }
}
for(const b of document.querySelectorAll("#tabs button"))
  b.onclick=()=>switchTab(b.dataset.tab);

/* ---------- 上游切换 ---------- */
async function initUpstreams(){
  const res=await fetch("/view/upstreams");
  const ups=await res.json();
  const sel=$("upstream");
  sel.innerHTML=ups.map(u=>
    "<option value='"+u.no+"'>"+esc(u.name)+"（#"+u.no+"）</option>").join("");
  sel.onchange=()=>{ state.no=Number(sel.value); state.offset=0;
    state.sid=null; state.sel.clear(); updateSelInfo();
    $("detail").style.display="none";
    switchTab(state.tab); };
}
async function loadAll(){
  $("rows").innerHTML="<tr><td colspan='4' class='empty'>加载中…</td></tr>";
  $("meta").textContent="";
  try{ await loadMeta(); }catch(e){}
  try{ await loadFacets(); }catch(e){}
  try{ await loadSessions(); }catch(e){}
}
async function loadMeta(){
  const m=await api("/api/meta");
  let s=m.sessions+" 会话 · "+
    (m.time_min||"?")+" ~ "+(m.time_max||"?");
  /* v0.19：库快照指纹（上游 /api/meta additive 字段；旧上游无此字段时静默降级） */
  const f=m.db_fingerprint;
  if(f){
    const mt=String(f.db_mtime||"");
    s="库: "+f.sessions+" 会话/"+f.errors+" 错误 @ "+
      (mt.slice(5,16)||f.db_mtime)+" ｜ "+s;
  }
  $("meta").textContent=s;
}
async function loadFacets(){
  const f=await api("/api/facets");
  fillSelect("f-source",f.sources);
  fillSelect("f-model",f.models);
  fillSelect("f-skill",f.skills);
}

const ROLE_LABEL={user:"用户",assistant:"助手",note:"工具/思考",system:"系统"};
function renderMsg(m){
  const role=m.role||"note";
  const known=ROLE_LABEL.hasOwnProperty(role);
  const cls=known?"m-"+role:"m-note";
  const label=known?ROLE_LABEL[role]:role;
  const text=m.content??"";
  if(role==="note"&&text.length>400)
    return "<div class='msg "+cls+"'><span class='who'>"+esc(label)+
      "（"+text.length+" 字）</span><details><summary>展开</summary>"+
      "<div class='body'>"+esc(text)+"</div></details></div>";
  return "<div class='msg "+cls+"'><span class='who'>"+esc(label)+
    "</span><div class='body'>"+esc(text)+"</div></div>";
}

/* 锚点直通：打开会话 → 分批并发逐回合定位错误原文 → 高亮命中消息 */
async function gotoAnchor(sid,seq,errText){
  switchTab("sessions");
  await openSession(sid);
  const probe=String(errText||"").replace(/\s+/g," ").trim();
  if(!probe){ showBanner("warn","锚点无错误原文，已打开会话 "
    +sid+"（回合列表中自行定位 step #"+seq+"）"); return; }
  const d=await api("/api/session/"+encodeURIComponent(sid));
  const n=Math.min(d.n_turns||0,80);
  for(let base=1;base<=n;base+=5){
    const batch=[...Array(5)].map((_,i)=>base+i).filter(x=>x<=n);
    const rs=await Promise.all(batch.map(x=>
      api("/api/session/"+encodeURIComponent(sid)+"/turn/"+x)
        .catch(()=>null)));
    for(const t of rs){
      if(!t)continue;
      let idx=(t.messages||[]).findIndex(m=>
        String(m.content||"").replace(/\s+/g," ").includes(probe));
      if(idx<0){ /* 降级：用更短探针再试 */
        const p2=probe.slice(0,30);
        if(p2) idx=(t.messages||[]).findIndex(m=>
          String(m.content||"").replace(/\s+/g," ").includes(p2));
      }
      if(idx>=0){
        await openTurn(sid,t.turn,idx);
        return;
      }
    }
  }
  showBanner("warn","已在会话 "+sid+" 中打开全文检索定位，"
    +"但未找到与错误原文逐字匹配的消息（表述可能经 adapter 改写）——"
    +"可按 step #"+seq+" 在回合列表中人工定位。");
}

/* ---- 报告/队列的本地异常过滤（v2.3）：不重新请求，仅重渲染 ---- */
function repFilter(){
  return {q:$("rep-q").value.trim().toLowerCase(),
          only:$("rep-erronly").checked};
}
function hitQ(text,q){return !q||String(text||"").toLowerCase().includes(q);}
function renderTools(d,out){
  const f=repFilter();
  /* 异常明细数据面：优先 roots（后端 aggregate_error_roots 已归一聚合，
     v0.21 P0-2 additive）；旧上游无 roots 字段时降级 errors 扁平化。
     计数用真实错误次数累加（旧实现 g.count++ 丢失了明细次数）。 */
  let allErrs=[];
  for(const t of d.tools||[]){
    if(t.roots&&t.roots.length){
      for(const g of t.roots)
        allErrs.push({tool:t.tool,detail:g.pattern,cls:g["class"]||"",
                      count:g.count,sample:g.sample||""});
    }else for(const e of t.errors||[])
      allErrs.push({tool:t.tool,detail:e.detail,cls:"",count:e.count||1,
                    sample:e.detail||""});
  }
  if(f.q)allErrs=allErrs.filter(x=>hitQ(x.tool+" "+x.detail,f.q));
  const byDetail=new Map();
  for(const x of allErrs){
    let g=byDetail.get(x.detail);
    if(!g){g={detail:x.detail,count:0,cls:x.cls,sample:x.sample,
              tools:new Set()};byDetail.set(x.detail,g);}
    g.count+=x.count;g.tools.add(x.tool);
    if(!g.sample&&x.sample)g.sample=x.sample;
  }
  const errs=[...byDetail.values()].map(g=>({...g,tools:[...g.tools]}))
    .sort((a,b)=>b.count-a.count);
  const errTable=()=>{
    let h="<h3 class='sec'>异常根因明细"+(f.q?"（关键字“"+esc(f.q)+"”命中）":"")+
      "（按次数倒序；同根因已归并——模式已去路径/引号/数字差异）</h3>";
    h+=errs.length?("<table><thead><tr><th class='num'>次数</th>"+
      "<th>根因模式</th><th>类别</th><th>工具</th><th>样例</th></tr></thead><tbody>"+
      errs.slice(0,80).map(e=>"<tr><td class='num'>"+e.count+"</td><td class='sub2'>"+
      esc(e.detail)+"</td><td>"+esc(e.cls)+"</td><td>"+
      esc(e.tools.join("/"))+"</td><td class='sub2'>"+
      esc(e.sample.slice(0,160))+"</td></tr>").join("")+"</tbody></table>")
      :"<div class='empty'>无命中</div>";
    return h;
  };
  if(f.only||f.q){
    $("rep-meta").textContent+="｜过滤后异常根因 "+errs.length+" 条";
    out.innerHTML=errTable();
    return;
  }
  const tot=d.tools.reduce((a,t)=>a+t.calls,0);
  const err=d.tools.reduce((a,t)=>a+t.error,0);
  const given=d.tools.reduce((a,t)=>a+(t.given_up||0),0);
  $("rep-meta").textContent="工具 "+d.tools.length+"｜调用 "+tot+
    "｜失败 "+err+"（"+(tot?(err/tot*100).toFixed(1):0)+"%）｜放弃 "+given;
  /* 归一后行结构：raw_tools 附原始写法；given_up>0 徽章；low-sample 徽章 */
  const rawTip=t=>(t.raw_tools||[]).filter(x=>x!==t.tool);
  const lowBadge=t=>t.low_sample?"<span class='badge b-org' "+
    "title='样本量低于阈值，结论仅供观察'>low-sample</span>":"";
  let html="<h3 class='sec'>工具失败率排行</h3><table><thead><tr>"+
    "<th>工具</th><th class='num'>调用</th><th class='num'>成功</th>"+
    "<th class='num'>失败</th><th class='num'>失败率</th>"+
    "<th class='num'>放弃</th></tr></thead><tbody>"+
    (d.tools.length?d.tools.map(t=>{
      const rt=rawTip(t);
      const gnum=t.given_up?"<span class='badge b-red' "+
        "title='错误后同会话同工具无再次调用（未解决）'>"+t.given_up+"</span>"
        :"0";
      return "<tr><td>"+esc(t.tool)+
      (rt.length?"<span class='sub2'>（"+esc(rt.join("/"))+"）</span>":"")+
      lowBadge(t)+
      "</td><td class='num'>"+t.calls+"</td><td class='num'>"+t.success+
      "</td><td class='num'>"+t.error+"</td><td class='num'>"+
      (t.fail_rate*100).toFixed(1)+"%</td><td class='num'>"+gnum+
      "</td></tr>";}).join("")
    :"<tr><td colspan='6' class='empty'>无工具调用数据</td></tr>")+
    "</tbody></table>";
  if(d.flow&&d.flow.errors){
    const f=d.flow;
    html+="<h3 class='sec'>失败后续行为（重试/放弃）</h3><p class='sub2'>"+
      "失败 "+f.errors+" 次：重试 "+f.retried+"（"+
      (f.errors?f.retried/f.errors*100:0).toFixed(0)+"%）｜ 放弃 "+
      f.given_up+"（"+(f.errors?f.given_up/f.errors*100:0).toFixed(0)+
      "%）——高放弃率+高失败率=用户路径被硬性挡断，优先修。</p>";
  }
  const srcs=Object.keys(d.by_source||{});
  if(srcs.length){
    html+="<h3 class='sec'>按 Agent（数据源）分布</h3>";
    for(const s of srcs){
      const o=d.by_source[s];
      html+="<details><summary>"+esc(s)+"（调用 "+o.calls+"｜失败 "+
        o.errors+"）</summary><table><thead><tr><th>工具</th>"+

    :"<div class='empty'>无</div>";
  html+="<h3 class='sec'>待人工归因（未命中模板，给证据不给结论）</h3>";
  html+=leftover.length?("<table><thead><tr><th class='num'>次数</th>"+
    "<th>模式</th><th>类别</th><th>未解决</th><th>样例锚点</th></tr></thead><tbody>"+
    leftover.map(x=>"<tr><td class='num'>x"+x.count+"</td><td>"+

function renderCards(d,out){

/* chain 长文 → 中栏时间线 + 右栏文档。404（尚无长文）降级为空态+复制命令。 */
async function openTopic(id){
  $("topics-toolbar").style.display="";
  $("topics-timeline").innerHTML="<div class='empty'>加载中…</div>";
  const res=await fetch("/u/"+state.no+"/api/topic/"
    +encodeURIComponent(id)+"/chain");
  if(res.status===404){
    state.topicCur={id:id};
    updateTopicCmd();
    $("topics-right").style.display="none";
    $("topics-timeline").innerHTML=errorBox(
      "该主题尚无 chain 长文——用上方「复制命令」取蒸馏包（pack），"+
      "由 Agent 消费创作 chain-*.md 放入 knowledge/topics/ 后刷新即见。");
    return;
  }
  if(!res.ok){ await failApi(res); return; }
  const d=await res.json();
  state.topicCur={id:id};
  updateTopicCmd();
  $("topics-right").style.display="block";
  renderChain(d,$("topics-timeline"));
  bindTopicNodes($("topics-timeline"));
}

    "<h2>"+esc(fm.topic||d.topic_id||"主题")+" · chain 长文</h2>"+
    "<div class='sub'>成员 "+((fm.members||[]).length)+"｜锚点 "+nNodes+
    (d.chain_path?"｜产物 "+esc(d.chain_path):"")+"</div>"+
    (fm.db_fingerprint?"<div class='sub2'>快照指纹 "+
      esc(JSON.stringify(fm.db_fingerprint)).slice(0,140)+"</div>":"")+
    "<div style='white-space:pre-wrap;word-break:break-word;margin-top:10px'>"+
    esc(d.body||"")+"</div>";

    nNodes+" 锚点）</h3>"+
    "<p class='sub2'>点节点跳回原会话对应回合（任一节点一键回原文）；"+
    "深挖分层用上方「复制命令」，由 CLI 生成蒸馏包——本视图绝不执行。</p>";

        "<td class='t-src'>"+esc(it.source)+"</td><td>"+
        hl(it.title,q)+"</td></tr>").join("")+"</tbody></table>";
    }
    html+="</div>";
  });
  out.innerHTML=html;
  for(const tr of out.querySelectorAll("tr[data-sid]"))
    tr.onclick=()=>gotoCross(Number(tr.dataset.no),tr.dataset.sid);
}
function gotoCross(no,sid){
  $("upstream").value=String(no);
  state.no=no;
  state.loaded.sessions=false; /* 切上游后检索视图需重置 */
  switchTab("sessions");
  openSession(sid).catch(()=>{});
}

/* ---------- 导出与复制（全部浏览器本地完成；本视图绝不执行命令） ---------- */
function dlText(filename,text){
  const b=new Blob([text],{type:"text/markdown;charset=utf-8"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(b);a.download=filename;
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),3000);
}
/* 机器可读导出：JSON 下载（浏览器本地完成） */
function dlJson(filename,obj){
  const b=new Blob([JSON.stringify(obj,null,1)],
    {type:"application/json;charset=utf-8"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(b);a.download=filename;
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),3000);
}
async function copyText(text,btn){
  try{ await navigator.clipboard.writeText(text); }
  catch(e){ /* file:// 或旧浏览器降级 */
    const ta=document.createElement("textarea");
    ta.value=text;document.body.appendChild(ta);ta.select();
    document.execCommand("copy");ta.remove();
  }
  if(btn){const old=btn.textContent;btn.textContent="已复制";
    setTimeout(()=>{btn.textContent=old;},1200);}
}
function today(){return new Date().toISOString().slice(0,10);}
function cell(x){return String(x??"").replace(/\|/g,"\\|").replace(/\n/g," ");}
function mdTable(head,rows){
  return "| "+head.join(" | ")+" |\n|"+head.map(()=>"---").join("|")+
    "|\n"+rows.map(r=>"| "+r.map(cell).join(" | ")+" |").join("\n")+"\n";
}
/* 会话全文导出：回合按 5 并发分批拉取，拼为 Markdown（本地下载） */
async function exportSessionMd(sid){
  const btn=$("btn-sess-export");
  const d=await api("/api/session/"+encodeURIComponent(sid));
  const m=d.meta||{};
  const nos=(d.turns||[]).map(t=>t.no);
  const texts={};
  for(let i=0;i<nos.length;i+=5){
    await Promise.all(nos.slice(i,i+5).map(async no=>{
      texts[no]=await api("/api/session/"+encodeURIComponent(sid)
        +"/turn/"+no);
    }));
    if(btn)btn.textContent="导出中 "+Math.min(i+5,nos.length)+"/"+nos.length;
  }
  let md="# "+(m.title||sid)+"\n\n"+
    "- sid: `"+sid+"`\n- 来源: "+(m.source||"?")+
    " · 模型: "+(m.model||"（未知）")+
    "\n- 创建 "+(m.created_at||"?")+" · 更新 "+(m.updated_at||"?")+
    " · 共 "+nos.length+" 回合\n\n导出时间 "+new Date().toLocaleString()+
    "（harvester-view 浏览器本地生成）\n\n---\n";
  for(const no of nos){
    const msgs=(texts[no]||{}).messages||[];
    md+="\n## 回合 #"+no+(msgs.length?"（"+(msgs[0].ts||"")+"）":"")+"\n";
    for(const msg of msgs)
      md+="\n**["+(ROLE_LABEL[msg.role]||msg.role||"note")+"]** "+
        (msg.ts||"")+"\n\n"+(msg.content??"")+"\n";
  }
  dlText("session-"+sid.replace(/[^\w.-]+/g,"_")+".md",md);
  if(btn)btn.textContent="导出 md";
}
/* 报告 → Markdown（与页面渲染同口径） */
function mdReport(kind,d){
  let md="# harvester 报告";
  if(kind==="tools"){
    md+="：G1 工具统计\n\n"+mdTable(["工具","调用","成功","失败","失败率","放弃"],
      (d.tools||[]).map(t=>[t.tool+
        ((t.raw_tools||[]).filter(x=>x!==t.tool).length?
          "（"+t.raw_tools.filter(x=>x!==t.tool).join("/")+"）":"")+
        (t.low_sample?" [low-sample]":""),
        t.calls,t.success,t.error,
        (t.fail_rate*100).toFixed(1)+"%",t.given_up||0]));
    const f=d.flow;
    if(f&&f.errors)md+="\n失败后续：重试 "+f.retried+"（"+
      (f.retried/f.errors*100).toFixed(0)+"%）｜放弃 "+f.given_up+"（"+
      (f.given_up/f.errors*100).toFixed(0)+"%）\n";
    for(const s of Object.keys(d.by_source||{})){
      const o=d.by_source[s];
      md+="\n## 按源："+s+"（调用 "+o.calls+"｜失败 "+o.errors+"）\n\n"+
        mdTable(["工具","调用","失败","失败率"],
        (o.tools||[]).map(t=>[t.tool,t.calls,t.error,
          (t.fail_rate*100).toFixed(1)+"%"]));
    }
  }else if(kind==="errors"){
    const m=d.meta||{};
    md+="：G2 错误三分类\n\n- 错误 "+(m.error_count||0)+" / 总步骤 "+
      (m.total_steps||0)+"｜涉及 "+(m.sessions||0)+" 会话\n\n";
    md+=mdTable(["类别","次数"],
      Object.entries(d.by_class||{}).map(e=>[e[0],e[1]]));
    md+="\n"+mdTable(["轨迹位置","次数"],
      Object.entries(d.by_bucket||{}).map(e=>[e[0],e[1]]));
    md+="\n## 错误模式明细\n\n"+mdTable(["次数","模式","类别","工具"],
      (d.patterns||[]).map(x=>["x"+x.count,x.pattern,x["class"],
        x.tools.join("/")]));
  }else if(kind==="skills"){
    md+="：G4 Skill 行为画像（调用 "+d.n_invocations+" 次）\n\n"+
      mdTable(["Skill","调用","会话","成功","失败","无结果","来源"],
      (d.skills||[]).map(s=>[s.skill,s.calls,s.sids,s.ok,s.err,
        s.no_result,s.sources.join("/")]));
  }else if(kind==="agents"){
    md+="：G2 建议条目（AGENTS.md 候选）\n";
    const todo=(d.entries||[]).filter(e=>(e.unresolved_count||0)>=1);
    const watch=(d.entries||[]).filter(e=>!(e.unresolved_count>=1));
    if(todo.length){
      md+="\n## 待修清单（未解决 >= 1）\n";
      for(const e of todo)
        md+="\n### "+e.title+"（owner: "+(e.owner||"?")+
          "｜status: "+(e.status||"pending")+"）\n\n"+e.body+
          "\n\n（实测 x"+e.total+"｜未解决 "+e.unresolved_count+"）\n";
    }
    if(watch.length){
      md+="\n## 观察区（未解决 = 0，已自愈）\n";
      for(const e of watch)
        md+="\n### "+e.title+"（owner: "+(e.owner||"?")+
          "｜status: "+(e.status||"pending")+"）\n\n（实测 x"+e.total+"）\n";
    }
    md+="\n## 未达标 pattern（供参考）\n\n"+
      mdTable(["次数","模式","类别","未解决"],
      (d.leftover||[]).map(x=>["x"+x.count,x.pattern,x["class"],
        x.given_up||0]));
  }else if(kind==="cards"){
    const s=d.summary||{};
    md+="：G3 卡片校验（"+d.root+"）\n\n- 通过 "+(s.ok||0)+"｜警告 "+
      (s.warn||0)+"｜错误 "+(s.error||0)+"｜锚点校验 "+
      (s.anchor_checked||0)+"（未命中 "+(s.anchor_misses||0)+"）\n";
    for(const c of (d.cards||[]).filter(c=>c.errors.length||c.warnings.length))
      md+="\n## "+c.path+"\n\n"+
        c.errors.map(e=>"- 错误："+e).concat(
        c.warnings.map(w=>"- 警告："+w)).join("\n")+"\n";
  }
  return md;
}

  else if(kind==="errors")renderErrors(state.repLast,out);
  else if(kind==="skills")renderSkills(state.repLast,out);
  else if(kind==="agents")renderAgents(state.repLast,out);
  else if(kind==="cards")renderCards(state.repLast,out);
  bindAnchors(out);
}

    hint:"harvester-view 导出的机器可读快照（上游 API 原始结构）。"+
      "errors/patterns 已在上游按归一模式去重聚类（pattern 为归一键；"+
      "samples 含 (sid,seq) 锚点，可回溯原会话原文），可直接交给 Agent 分析。",
    data:d};
}

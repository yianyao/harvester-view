/* 队列 → 处理单（v0.49）。
   用户 2026-10-13 实测报的正是「点去处理跳过去以后**明细对不上**」：数字与明细
   现在同源（/api/workitems?target=…），跳过去看到的就是正好这一批，且带处理建议
   与命令包。参数既可是 queue_id（repair），也可是完整 target（queue:repair）。 */
function goQueue(qid){
  const s=String(qid||"");
  return openWork(s.indexOf(":")>=0?s:("queue:"+s));
}
/* 所有「数字皆门」的统一入口：设置 target 并按需加载处理单。
   顺序纪律（SOP §5 第 1 条）：**不要**在 switchTab 之前置位 state.loaded，
   否则守卫会挡掉加载函数；这里由 switchTab 自己置位并调 loadWork()。 */
function openWork(target){
  state.workTarget=target;
  /* 2026-10-13 修（用户实测：回工作台后点其他项无法跳转）：**切 tab 必须
     无条件执行**。旧写法在 state.loaded.work 已真时只调 loadWork 不切页——
     数据渲染进了隐藏的处理单页，人却留在工作台。switchTab 的守卫只管
     「是否重复加载数据」，不管「要不要显示」；首跳走 switchTab 内置的
     loadWork()（state.workTarget 已置位，两路拿到的是同一份 target）。 */
  const first=!state.loaded.work;
  switchTab("work");
  if(!first)loadWork(target).catch(()=>{});
  return target;
}
/* 处理单里的「去处理」按钮/环段绑定（数据与队列卡同一套 target） */
function bindWorkGo(root){
  for(const b of root.querySelectorAll("[data-wgo]"))
    b.onclick=()=>openWork(b.dataset.wgo);
}
function renderQueueDetail(d){
  const det=d.queue_details||{};
  let h="<details open><summary>队列明细（每行数字都能点开**它自己**的明细）</summary>";
  for(const q of d.queues||[]){
    const arms=det[q.queue_id]||[];
    if(!arms.length)continue;
    h+="<div class='sub2' style='margin-top:6px'><b>"+esc(q.label)+"</b> 的拆解："+
      "（同一批明细可有多条指标：条目数与次数和分开算，各自标注）</div>";
    h+="<div class='arms'>"+arms.map(a=>armHtml(a)).join("")+"</div>";
  }
  h+="</details>";
  const box=$("home-qdetail");
  box.innerHTML=h;
  bindWorkGo(box);
}
function armHtml(a){
  const lv=a.level||"";
  const ms=(a.metrics&&a.metrics.length>1)?
    ("<div class='wi-facts'>"+a.metrics.map(m=>"<span>"+esc(m.label)+"："+
      m.value+" "+esc(m.unit||"")+"</span>").join("")+"</div>"):"";
  return "<div class='arm "+esc(lv)+"'>"+
    "<div class='av'>"+a.value+"<span class='au'> "+esc(a.unit||"")+"</span></div>"+
    "<div class='ad'>"+esc(a.definition||"")+"</div>"+
    ms+
    "<div class='as'>"+esc(a.source||"")+"</div>"+
    (a.where?"<div class='ad'>去："+esc(a.where)+"</div>":"")+
    (a.aggregate?"<div class='ad'>聚合数（不派活）</div>":"")+
    (a.target?("<button class='xbtn' data-wgo=\""+esc(a.target)+
      "\">去处理</button>"):"")+
    (a.suggestion?"<div class='ad'>建议："+esc(a.suggestion)+"</div>":"")+
    (a.reconcile_ok===false?
      "<div class='ad' style='color:var(--err-ink)'>⚠ 对账断了</div>":"")+
    "</div>";
}
function renderRings(d){
  const box=$("home-rings");
  const rs=d.rings||[];
  if(!rs.length){box.innerHTML="<div class='empty'>无环数据</div>";return;}
  box.innerHTML=rs.map(r=>{
    const blocked=(r.arms||[]).filter(a=>a.value>0).length;
    return "<div class='ring'><div class='rt'>"+esc(r.title)+
      "　<span class='sub2'>"+(blocked?
        ("有 "+blocked+" 段有积压"):"无积压")+"</span></div>"+
      "<div class='rd'>"+esc(r.definition||"")+"</div>"+
      "<div class='arms'>"+(r.arms||[]).map(a=>armHtml(a)).join("")+"</div></div>";
  }).join("");
  /* 闭环健康的每一段与四队列走**同一条动线**（用户 2026-10-13：当前不能跳转、
     也无建议）——每段都带 target 与 suggestion，于是都点得动。 */
  bindWorkGo(box);
}

/* ---------- Tab: 处理单（v0.49） ----------
   用户需求原文：「跳转到的页面希望**只显示需处理的记录**，并有处理建议，
   能打包处理命令且可直接跳转到命令台。」
   纪律：只渲染服务端给的 count 与 items，**不在这里再筛再算**
   （再筛一次就是"明细对不上"的老毛病）。 */
async function loadWork(target){
  if(target)state.workTarget=target;
  const head=$("work-head"),box=$("work-items");
  if(!state.workTarget){
    head.innerHTML="<div class='empty'>从「今日工作台」点任意数字进入。</div>";
    box.innerHTML="";$("work-pkg").innerHTML="";$("work-foot").innerHTML="";
    return;
  }
  head.innerHTML="<div class='empty'>正在取处理单（现算，约 2–4 秒）…</div>";
  box.innerHTML="";$("work-pkg").innerHTML="";
  try{ await loadGlossary(); }catch(e){}
  $("work-intro").innerHTML=panelIntro("work");
  const d=await actApi("/api/workitems?target="+encodeURIComponent(state.workTarget));
  if(d.__err){
    head.innerHTML=errorBox("处理单不可用："+d.__err+
      "（需要动作面在 8766 运行；也可直接看命令行）");
    return;
  }
  state.work=d;
  renderWorkHead(d);
  renderWorkPkg(d);
  renderWorkItems(d);
  $("work-foot").innerHTML="数据库指纹："+
    esc(JSON.stringify((d.db_fingerprint||{}).sessions||"—"))+" 会话　"+
    "（本页明细与工作台数字同源：/api/workitems，非缓存）";
  if(glossary.loaded)applyTermTooltips(head);
}
function renderWorkHead(d){
  const rc=(d.reconcile||[]).filter(r=>!r.ok);
  const grp=d.group==="queue"?"四队列":(d.group==="detail"?"队列明细":"闭环健康");
  const ms=(d.metrics||[]).map(m=>"<span>"+esc(m.label)+"："+m.value+" "+
    esc(m.unit||d.unit||"")+"</span>").join("");
  const by=(d.reconcile||[]).map(r=>r.metric+"="+r.by).join("；");
  $("work-head").innerHTML=
    "<div class='wi-head'><div class='wt'>"+esc(d.label)+
    "　<span class='sub2'>"+esc(grp)+(d.where?"　落点："+esc(d.where):"")+
    "</span></div>"+
    "<div style='margin:5px 0'><span class='wn'>"+d.count+"</span>"+
    "<span class='sub2'>"+esc(d.unit||"")+"</span>　"+
    "<span class='sub2'>责任方："+esc(d.owner||"—")+"</span></div>"+
    (ms?"<div class='wi-facts'>"+ms+"</div>":"")+
    "<div class='wd'>口径："+esc(d.definition||"")+"</div>"+
    "<div class='qs'>"+esc(d.source||"")+"</div>"+
    "<div class='wi-recon"+(rc.length?" bad":"")+"'>"+
      (rc.length?("⚠ **对账断了**：数字与明细对不上（"+esc(rc.map(r=>r.metric)
        .join("、"))+"）——先别照着下面的清单派活，回头查 workitems。")
        :("✓ 对账通过：下面 "+d.items.length+" 条就是这 "+d.count+" 的全部"
          +"（"+esc(by)+"；两者由同一个函数派生，不是巧合）"))+
    "</div></div>"+
    "<div class='wi-sug'><b>处理建议：</b>"+esc(d.suggestion||"（这批还没写建议）")+
    "</div>";
}
/* 把 target 的「命令包 + 每条明细自带的命令」摊平成一份可复制/可执行的清单。
   纯函数（只读参数），故渲染门能单独 extract 执行。 */
function workRows(d){
  const rows=[];
  for(const c of d.package||[])
    rows.push({label:c.label,note:c.note,cli:c.cli,action_id:c.action_id,
      params:c.params||{},tier:c.tier,src:""});
  for(const i of d.items||[])
    for(const c of (i.commands||[]))
      rows.push({label:c.label,note:c.note,cli:c.cli,action_id:c.action_id,
        params:c.params||{},tier:c.tier,src:i.title});
  return rows;
}
function renderWorkPkg(d){
  const box=$("work-pkg"),rows=workRows(d);
  if(!rows.length){
    box.innerHTML="<details><summary>处理命令包</summary>"+
      "<div class='sub2'>这批没有可打包的命令（多为已完成的项或纯聚合数）。</div>"+
      "</details>";
    return;
  }
  const shown=rows.slice(0,60);
  let h="<details open><summary>处理命令包（批量 "+rows.length+" 条命令）</summary>";
  h+="<p class='sub2'>纪律：本视图**不代你执行**。命令行是给你核对后粘贴的"+
     "（在 session-harvester 仓根目录执行）；带「在命令台打开」的能在命令台"+
     "按两段提交执行——**先预演、你确认、才写**。</p>"+
     "<div class='wi-tools'><button class='xbtn' id='work-copy'>"+
     "复制全部命令</button></div>";
  for(const r of shown){
    h+="<div class='wi-item'><h4>"+esc(r.label||"命令")+
      (r.tier?" <span class='tierbadge "+esc(r.tier)+"'>"+esc(r.tier)+" 档</span>":"")+
      (r.action_id?" <span class='sub2'>可在命令台执行</span>":"")+"</h4>"+
      (r.src?"<div class='wd'>针对："+esc(r.src)+"</div>":"")+
      (r.note?"<div class='wd'>"+esc(r.note)+"</div>":"")+
      "<div class='wi-cmd'>"+esc(r.cli||"（服务端未给命令行文本）")+"</div>"+
      (r.action_id?("<button class='xbtn' data-wact=\""+esc(r.action_id)+
        "\" data-wparams=\""+esc(JSON.stringify(r.params))+
        "\">在命令台打开</button>"):"")+
      "</div>";
  }
  if(rows.length>shown.length)
    h+="<div class='sub2'>另有 "+(rows.length-shown.length)+
       " 条未在此列出（下面每条明细都带着自己的命令）。</div>";
  box.innerHTML=h+"</details>";
  const cb=$("work-copy");
  if(cb)cb.onclick=()=>copyText(rows.map(r=>r.cli||"").filter(Boolean).join("\n"),cb);
  for(const b of box.querySelectorAll("[data-wact]"))
    b.onclick=()=>{openInCmd(b.dataset.wact,JSON.parse(b.dataset.wparams||"{}"));};
}
function renderWorkItems(d){
  const box=$("work-items"),items=d.items||[];
  if(!items.length){
    box.innerHTML="<h3 class='sec'>待处理记录</h3><div class='empty'>"+
      (d.count===0?"这一队是空的——当前没有需要处理的记录。"
                  :"（明细为空，且与数字对不上，见上方对账结论）")+"</div>";
    return;
  }
  let h="<h3 class='sec'>待处理记录（"+items.length+" 条，与上面的数字同源）</h3>";
  h+=items.map(it=>{
    const facts=(it.facts||[]).map(f=>"<span>"+esc(f[0])+"："+esc(f[1])+
      "</span>").join("");
    const cmds=(it.commands||[]).map(c=>"<div class='wi-cmd'>"+
      esc(c.cli||"")+"</div>").join("");
    return "<div class='wi-item "+esc(it.level||"")+"'>"+
      "<h4>"+esc(it.title)+
      (it.owner?" <span class='sub2'>"+esc(it.owner)+"</span>":"")+"</h4>"+
      (facts?"<div class='wi-facts'>"+facts+"</div>":"")+
      (it.anchor?("<div class='wd'>证据锚点（点开回原文）："+
        anchor(it.anchor.sid,it.anchor.seq,it.anchor.probe)+"</div>"):"")+
      (it.detail?"<div class='wd'>"+esc(it.detail)+"</div>":"")+
      (it.suggestion?"<div class='wd'><b>建议：</b>"+esc(it.suggestion)+"</div>":"")+
      cmds+"</div>";
  }).join("");
  box.innerHTML=h;
  bindAnchors(box);
}
/* 处理单 → 命令台：把 action_id 与参数带过去（用户点一下就到位，不用手抄 key）。
   注意**不能**先置 state.loaded.cmd：那是 switchTab 的加载守卫（SOP §5 第 1 条）。
   这里反过来——先 switchTab（它会按需调 loadCmdData），再填参数、再渲染。 */
async function openInCmd(actionId,params){
  switchTab("cmd");
  if(!state.act.loaded){
    try{ await loadCmdData(); }catch(e){}
  }
  const spec=actionSpec(actionId);
  if(!spec){
    showBanner("warn","动作面没有这条动作（不可达或版本握手不匹配）——"+
      "命令行仍可复制后在仓根目录粘贴执行。");
    return false;
  }
  const c=cmdCommands().find(x=>x.cmd===spec.cmd);
  if(c)state.cmdCard=c.card_id;
  state.actionId=actionId;
  state.cmdParams=Object.assign({},params||{});
  state.chain=[];
  renderCmdCards();renderCmdActions();renderCmdParams();
  showBanner("warn","已把动作装到命令台："+String(spec.summary||actionId)+
    "　—— 点「预演」看清将写什么，确认后才写。");
  return true;
}

/* ---------- 会话抑制（v0.49；用户批准清单 ①–⑦，⑧ 不做）----------
   纪律两条：
   ① **不新造写路径**：删除/恢复都只是把动作装到命令台，走现成的 B 档两段提交
      （预演 → 你确认 → 才写）+ 台账（destructive 带删除前快照）；
   ② 「已抑制」清单**一次取全量**（`/api/suppressed`），**不做客户端分页筛选**——
      在只有一页的表格上做筛选，看起来像"全部就这些"，那是 §七 20 那类静默骗人。
   口径照抄上游：抑制只作用于**仓内副本**，不删采集源；取消抑制**不恢复**数据，
   能不能恢复**只取决于语料是否还在**；**不设恢复时限**。 */
async function loadSuppressed(manual){
  const on=!!$("f-suppressed").checked;
  const panel=$("suppressed-panel"),tbl=$("sess-table"),pager=$("pager");
  if(!on){
    panel.style.display="none";panel.innerHTML="";
    tbl.style.display="";pager.style.display="";
    return;
  }
  tbl.style.display="none";pager.style.display="none";
  panel.style.display="";
  panel.innerHTML="<div class='empty'>正在取已抑制清单…</div>";
  const d=await actApi("/api/suppressed");
  if(d.__err){
    panel.innerHTML=errorBox("抑制清单不可用："+d.__err+
      "（需要动作面在 8766 运行）");
    return;
  }
  state.suppressed=d;
  renderSuppressed(d);
  if(manual)showBanner("warn","已抑制清单已刷新（口径见页内说明）");
}
function renderSuppressed(d){
  const panel=$("suppressed-panel"),rows=d.rows||[];
  let h="<h3 class='sec'>已抑制会话（"+rows.length+" 条"+
    (d.configured?"":"　⚠ 起服时未配 --topics-meta，无处可查")+"）</h3>";
  h+="<p class='sub2'>口径（照抄上游，不许含糊）：抑制只作用于 <b>仓内副本</b>"+
    "（库内 sessions/messages/steps 行 + exports 下的 .json/.md 与 manifest 条目），"+
    "<b>不删采集源</b>（DSH/WorkBuddy 自己的会话文件一字节不动）。"+
    "「恢复」= 取消抑制，<b>不会恢复已删的行与副本</b>——能不能恢复"+
    "<b>只取决于语料是否还在</b>；只要语料还在，下次 sync/update 会重新导出并入库。"+
    "<b>本工具不设恢复时限。</b></p>";
  if(!rows.length){
    panel.innerHTML=h+"<div class='empty'>没有已抑制的会话。</div>";
    return;
  }
  h+="<table><thead><tr><th>会话</th><th style='width:140px'>抑制于</th>"+
    "<th style='width:110px'>谁</th><th>为什么</th>"+
    "<th style='width:90px'>操作</th></tr></thead><tbody>";
  h+=rows.map(r=>"<tr><td class='t-src' title='"+esc(r.sid)+"'>"+
    esc(cssShortId(r.sid))+"</td><td class='sub2'>"+esc(r.created||"—")+"</td>"+
    "<td class='sub2'>"+esc(r.created_by||"（未写）")+"</td>"+
    "<td class='sub2'>"+esc(r.reason||"（未写）")+"</td>"+
    "<td><button class='xbtn' data-unsuppress=\""+esc(r.sid)+
    "\" title='取消抑制（只删抑制表行，不恢复数据）'>恢复</button></td></tr>")
    .join("");
  panel.innerHTML=h+"</tbody></table>";
  for(const b of panel.querySelectorAll("[data-unsuppress]"))
    b.onclick=()=>{openInCmd("session_unsuppress",{sids:b.dataset.unsuppress})
      .catch(()=>{});};
}

/* ---------- 事件绑定 ---------- */
$("btn-search").onclick=()=>{state.q=$("f-q").value.trim();state.offset=0;
  loadSessions().catch(()=>{});};
$("f-q").addEventListener("keydown",e=>{
  if(e.key==="Enter")$("btn-search").click();});
$("f-erronly").onchange=()=>{state.offset=0;loadSessions().catch(()=>{});};
$("f-suppressed").onchange=()=>{loadSuppressed().catch(()=>{});};
$("sel-all").onchange=()=>{
  const on=$("sel-all").checked;
  for(const cb of document.querySelectorAll("input.selbox")){
    if(cb.disabled)continue;
    cb.checked=on;toggleSel(cb.dataset.sid,on);
  }
};
$("btn-batch-md").onclick=()=>exportAnalysis("sessions","md")
  .catch(e=>showBanner("err","批量导出失败："+e.message));
$("btn-batch-json").onclick=()=>exportAnalysis("sessions","json")
  .catch(e=>showBanner("err","批量导出失败："+e.message));
/* 报告/队列的本地过滤：不重新请求上游，直接重渲染（triage 需重取后本地过滤） */
function rerenderReport(){
  if(!state.repLast)return;
  const out=$("rep-out"), kind=state.repKind;
  if(kind==="tools")renderTools(state.repLast,out);
  else if(kind==="errors")renderErrors(state.repLast,out);
  else if(kind==="skills")renderSkills(state.repLast,out);
  else if(kind==="agents")renderAgents(state.repLast,out);
  else if(kind==="cards")renderCards(state.repLast,out);
  bindAnchors(out);
  if(glossary.loaded)applyTermTooltips(out);
}
$("rep-q").addEventListener("input",rerenderReport);
$("rep-erronly").onchange=rerenderReport;
$("tri-q").addEventListener("input",()=>{
  if(state.loaded.triage)loadTriage(false).catch(()=>{});});
/* 机器可读导出（报告/队列）：上游 JSON 原始结构 + 去重说明头 */
function machineWrap(kind,d){
  return {kind:kind, generated_at:new Date().toISOString(),
    hint:"harvester-view 导出的机器可读快照（上游 API 原始结构）。"+
      "errors/patterns 已在上游按归一模式去重聚类（pattern 为归一键；"+
      "samples 含 (sid,seq) 锚点，可回溯原会话原文），可直接交给 Agent 分析。",
    data:d};
}
$("btn-prev").onclick=()=>{state.offset=Math.max(0,state.offset-state.limit);
  loadSessions().catch(()=>{});};
$("btn-next").onclick=()=>{state.offset+=state.limit;
  loadSessions().catch(()=>{});};
$("btn-triage").onclick=()=>loadTriage(true).catch(()=>{});
$("btn-report").onclick=()=>loadReport(true).catch(()=>{});
$("rep-kind").onchange=()=>loadReport().catch(()=>{});
$("btn-agg-search").onclick=()=>loadAggSearch().catch(()=>{});
$("agg-q").addEventListener("keydown",e=>{
  if(e.key==="Enter")$("btn-agg-search").click();});
$("btn-agg-facets").onclick=()=>loadAggFacets().catch(()=>{});
$("btn-topics-refresh").onclick=()=>loadTopics().catch(()=>{});
$("topic-level").onchange=()=>updateTopicCmd();
$("btn-topic-gocmd").onclick=()=>topicGoCmd();
$("btn-topic-cmd").onclick=e=>{
  const b=e.currentTarget;
  if(b.dataset.cmd)copyText(b.dataset.cmd,b);};
$("btn-rep-export").onclick=()=>{
  if(!state.repLast){showBanner("warn","请先点“生成报告”再导出");return;}
  /* P1-4：tools/errors/skills 改调统一导出端点（md/JSON 同源）；
     agents/cards 端点未覆盖，保留本地拼装 */
  if(["tools","errors","skills"].includes(state.repKind)){
    exportAnalysis(state.repKind,"md")
      .catch(e=>showBanner("err","导出失败："+e.message));
    return;
  }
  dlText("harvester-report-"+state.repKind+"-"+today()+".md",
    mdReport(state.repKind,state.repLast));
};
$("btn-rep-json").onclick=()=>{
  if(!state.repLast){showBanner("warn","请先点“生成报告”再导出");return;}
  if(["tools","errors","skills"].includes(state.repKind)){
    exportAnalysis(state.repKind,"json")
      .catch(e=>showBanner("err","导出失败："+e.message));
    return;
  }
  dlJson("harvester-report-"+state.repKind+"-"+today()+".json",
    machineWrap("report-"+state.repKind,state.repLast));
};
$("btn-tri-export").onclick=()=>{
  if(!state.triLast){showBanner("warn","请先点“生成队列”再导出");return;}
  exportAnalysis("triage","md")
    .catch(e=>showBanner("err","导出失败："+e.message));
};
$("btn-tri-json").onclick=()=>{
  if(!state.triLast){showBanner("warn","请先点“生成队列”再导出");return;}
  exportAnalysis("triage","json")
    .catch(e=>showBanner("err","导出失败："+e.message));
};

$("btn-cmd-refresh").onclick=()=>loadCmdData(true).catch(()=>{});
$("btn-cmd-run").onclick=()=>runCmdAction()
  .catch(e=>showBanner("err","执行失败："+e.message));

initUpstreams().then(()=>{
  state.no=Number($("upstream").value||0);
  /* P3-3：默认落地页 = 今日工作台。**不做 loadAll()**——会话列表由用户
     点「会话检索」时按需加载。
     ⚠ 顺序要紧（2026-10-12 修）：`switchTab` 里是 `if(!state.loaded[name])`
     才调加载函数，所以**必须先 switchTab 再置位**。先置位会把 loadOverview()
     挡在守卫外面 → 页面永远停在「加载中…」（用户实测撞到）。 */
  switchTab("home");
  state.loaded.home=true;
}).catch(e=>showBanner("err","初始化失败: "+e));
</script>
